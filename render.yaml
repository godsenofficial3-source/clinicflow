services:
  - type: web
    name: clinicflow
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: FORCE_HTTPS
        value: "1"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: PRIVACY_EMAIL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
