      <form data-form="send-form" data-id="${a.id}" class="row gap"><label class="sr-only" for="sft">${t("send_form")}</label><select id="sft" name="template_id">${META.form_templates.map((f) => `<option value="${f.id}">${esc(CF.L(f, "title"))}</option>`).join("")}</select><button class="btn sm ghost" type="submit">${I("send")} ${t("send_form")}</button></form>
      ${a.history.length ? `<h3>${t("previous_visits")}</h3><ul class="plain-list small">${a.history.map((h) => `<li>${esc(CF.fmtShort(h.start))} · ${esc(CF.L(st(h.status), "label"))}</li>`).join("")}</ul>` : ""}
      ${["cancelled", "completed", "no_show"].includes(a.status) ? "" : `<h3>${t("change_time")}</h3>
      <div class="row gap wrap"><input type="date" id="rdate" value="${a.start.slice(0, 10)}" aria-label="${esc(t("choose_date"))}" data-change="resched-date" data-id="${a.id}" data-p="${a.provider_id}" data-type="${a.type_id}"/></div>
      <div id="rslots" class="slots small-slots"></div>
      <hr/><button class="btn danger" data-act="staff-cancel" data-id="${a.id}">${I("x")} ${t("cancel_appointment")}</button>`}`, { side: true });
  }
  CF.openAppt = openAppt;
  onForm("care-schedule", async (d, f) => {
    const id = f.dataset.appt;
    await api("POST", `/staff/appointments/${id}/care-reminders`, { ...d, times: d.times.split(",").map((time) => time.trim()) });
    CF.toast(t("saved"));
    await openAppt(id);
  });
  on("care-remove", async (el) => {
    if (!await CF.confirm(t("care_remove_q"), { danger: true, ok: t("remove") })) return;
    try {
      await api("DELETE", `/staff/appointments/${el.dataset.appt}/care-reminders/${el.dataset.id}`);
      await openAppt(el.dataset.appt);
    } catch (e) { CF.toast(CF.errMsg(e), "err"); }
  });
  on("modal-close-go", (el) => { CF.closeModal(); CF.go(el.dataset.to); });
  on("set-status", async (el) => { await api("PATCH", `/staff/appointments/${el.dataset.id}`, { status: el.value }); CF.toast(t("status_updated", { s: CF.L(st(el.value), "label") })); CF.refresh(); });
  on("set-provider", async (el) => { try { await api("PATCH", `/staff/appointments/${el.dataset.id}`, { provider_id: Number(el.value) }); CF.toast(t("saved")); CF.refresh(); } catch (e) { CF.toast(CF.errMsg(e), "err"); } });
  onForm("appointment-contact", async (d, f) => {
    const fields = ["patient_phone", "patient_email"].filter((name) => d[name] !== f.elements.namedItem(name).defaultValue);
    if (!fields.length) return;
    const { appointment } = await api("PATCH", `/staff/appointments/${f.dataset.id}`, Object.fromEntries(fields.map((name) => [name, d[name]])));
    for (const name of fields) {
      const input = f.elements.namedItem(name), saved = appointment[name] || "";
      if (input.value === d[name]) input.value = saved;
      input.defaultValue = saved;
    }
    CF.toast(t("saved"));
  });
  onForm("notes", async (d, f) => { await api("PATCH", `/staff/appointments/${f.dataset.id}`, d); CF.toast(t("saved")); });
  onForm("send-form", async (d, f) => { await api("POST", `/staff/appointments/${f.dataset.id}/forms`, { template_id: Number(d.template_id) }); CF.toast(t("form_sent_patient")); openAppt(f.dataset.id); });
  on("form-accept", async (el) => { await api("POST", `/staff/forms/${el.dataset.id}/accept`); CF.toast(t("saved")); openAppt(el.dataset.a); });
  onForm("form-return", async (d, f) => { await api("POST", `/staff/forms/${f.dataset.id}/return`, d); CF.toast(t("form_returned")); openAppt(f.dataset.a); });
  on("staff-cancel", async (el) => {
    if (!(await CF.confirm(t("staff_cancel_q"), { danger: true, ok: t("yes_cancel") }))) return;
    el.disabled = true;
    try { await api("POST", `/appointments/${el.dataset.id}/cancel`); CF.closeModal(); CF.toast(t("cancelled_ok")); CF.refresh(); }
    catch (e) { el.disabled = false; CF.toast(CF.errMsg(e), "err"); }
  });
  on("resched-date", async (el) => {
    const { slots } = await api("GET", `/clinics/${S.user.clinic_id}/slots?date=${el.value}&type=${el.dataset.type}&provider=${el.dataset.p}`);
    document.getElementById("rslots").innerHTML = slots.map((s) => `<button class="slot" data-act="staff-resched" data-id="${el.dataset.id}" data-s="${s.start}" data-p="${s.provider_id}">${esc(CF.fmtTime(s.start))}</button>`).join("") || `<p class="muted small">${t("no_slots")}</p>`;
  });
  on("staff-resched", async (el) => {
    try { await api("POST", `/appointments/${el.dataset.id}/reschedule`, { start: el.dataset.s, provider_id: Number(el.dataset.p) }); CF.toast(t("rescheduled_ok")); openAppt(el.dataset.id); CF.refresh(); }
    catch (e) { CF.toast(CF.errMsg(e), "err"); }
  });

  // =====================================================================
  // MANUAL BOOKING (phone / walk-in) – few clicks
  // =====================================================================
  const initialBooking = () => ({ date: CF.ymd(new Date()), type: null, provider: "", providerQuery: "", slot: null, source: "phone", draft: {}, patient: null, matches: [], mode: "new", lookup: "" });
  const patientMatchesHtml = () => B.lookup.trim().length < 2 ? `<p class="small muted">${t("lookup_hint")}</p>` :
    B.matches.map((p) => `<button type="button" class="choice" data-act="pick-booking-patient" data-id="${p.id}">
      <b>${esc(p.name)}</b><span class="small muted">${esc([p.phone, p.email].filter(Boolean).join(" · "))}</span></button>`).join("") || `<p>${t("no_returning_patients")}</p>`;
  const B = initialBooking();
  function bookingProviderOptions() {
    const query = B.providerQuery.trim().toLowerCase();
    return `<option value="">${t("any_provider")}</option>` + META.providers.filter((p) => p.active &&
      (String(p.id) === B.provider || `${p.name} ${p.specialty || ""}`.toLowerCase().includes(query)))
      .map((p) => `<option value="${p.id}" ${String(p.id) === B.provider ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  }
  function keepBookingDraft() {
    const form = document.querySelector('form[data-form="staff-book"]');
    if (form) B.draft = CF.formData(form);
  }
  route("/staff/book", { title: "nav_staff_book", roles: STAFF, render: async () => {
    if (B.userId !== S.user.id) Object.assign(B, initialBooking(), { userId: S.user.id });
    await CF.meta();
    if (!B.type) B.type = META.types[0]?.id;
    const { slots } = await api("GET", `/clinics/${S.user.clinic_id}/slots?date=${B.date}&type=${B.type}${B.provider ? `&provider=${B.provider}` : ""}`);
    return `<section class="page">
      <header class="page-head"><h1>${t("nav_staff_book")}</h1><p class="muted">${t("staff_book_sub")}</p></header>
      <div class="grid-book">
      <div class="card stack">
        <fieldset><legend class="label">${t("booked_by")}</legend><div class="seg-ctrl" role="radiogroup">${["phone", "in_person"].map((s) => `<button role="radio" aria-checked="${B.source === s}" data-act="bsrc" data-s="${s}">${I(sourceIcon(s))} ${t("src_" + s)}</button>`).join("")}</div></fieldset>
        <fieldset><legend class="label">${t("visit_type")}</legend><div class="check-pills">${META.types.map((ty) => `<button class="pill type-pill ${B.type === ty.id ? "on" : ""}" style="--c:${esc(ty.color)}" aria-pressed="${B.type === ty.id}" data-act="btype" data-id="${ty.id}">${esc(CF.L(ty, "name"))} · ${ty.minutes}′</button>`).join("")}</div></fieldset>
        ${CF.field("provider_search", t("find_practitioner"), { type: "search", value: B.providerQuery, attrs: 'data-input="booking-provider-query"' })}
        <div class="grid2"><div class="field"><label for="bp">${t("provider")}</label><select id="bp" data-change="bprov">${bookingProviderOptions()}</select></div>
          <div class="field"><label for="bd">${t("date")}</label><input id="bd" type="date" value="${B.date}" min="${CF.ymd(new Date())}" data-change="bdate"/></div></div>
        <h2 class="label">${t("free_times")} · ${esc(CF.relDay(B.date))}</h2>
        <div class="slots">${(() => { const u = []; slots.forEach((s) => { if (!u.find((x) => x.start === s.start)) u.push(s); }); return u; })().map((s) => `<button class="slot ${B.slot?.start === s.start ? "selected" : ""}" aria-pressed="${B.slot?.start === s.start}" data-act="bslot" data-s="${s.start}" data-p="${s.provider_id}">${esc(CF.fmtTime(s.start))}${B.provider ? "" : `<small>${esc(s.provider_name.replace("Dr. ", "Dr "))}</small>`}</button>`).join("") || `<p class="muted">${t("no_slots")}</p>`}</div>
      </div>
      <form data-form="staff-book" class="card stack sticky">
        <h2>${t("patient")}</h2>
        <div class="seg-ctrl patient-mode" role="radiogroup" aria-label="${esc(t("patient"))}">
          ${["new", "returning"].map((m) => `<button type="button" role="radio" aria-checked="${B.mode === m}" data-act="bmode" data-m="${m}">${I(m === "new" ? "plus" : "user")} ${t("patient_mode_" + m)}</button>`).join("")}</div>
        ${B.mode === "returning" && !B.patient ? `<div class="field"><label for="bps">${t("lookup_patient")}</label>
            <input id="bps" type="search" autocomplete="off" value="${esc(B.lookup)}" data-input="bp-search" aria-describedby="bp-matches"/></div>
          <div id="bp-matches" class="stack patient-matches" aria-live="polite">${patientMatchesHtml()}</div>` : ""}
        ${B.patient ? `<div class="notice info row between wrap">${I("user")}<span class="grow">${t("returning_selected", { name: `<b>${esc(B.patient.name)}</b>` })}</span>
          <button type="button" class="btn sm ghost" data-act="new-booking-patient">${t("change")}</button></div>` : ""}
        ${B.mode === "new" || B.patient ? `
        ${CF.field("patient_name", t("full_name"), { required: true, value: B.draft.patient_name, auto: "off", attrs: B.patient ? "readonly" : "" })}
        ${CF.field("phone", t("phone"), { type: "tel", value: B.draft.phone, auto: "off" })}
        ${CF.field("email", t("email"), { type: "email", value: B.draft.email, auto: "off", hint: B.patient ? t("contact_update_hint") : "" })}
        ${CF.field("reason", t("reason"), { value: B.draft.reason, hint: t("no_medical") })}` : ""}
        <div class="notice ${B.slot ? "info" : "warn"}">${I("cal")} ${B.slot ? `${esc(CF.relDay(B.slot.start))} · <b>${esc(CF.fmtTime(B.slot.start))}</b> · ${esc(META.providers.find((p) => p.id === B.slot.provider_id)?.name || "")}` : t("pick_slot_first")}</div>
        <button class="btn primary block" type="submit" ${B.slot && (B.mode === "new" || B.patient) ? "" : "disabled"}>${I("check")} ${t("book")}</button></form></div></section>`;
  } });
  on("bsrc", (el) => { keepBookingDraft(); B.source = el.dataset.s; CF.refresh(); });
  on("btype", (el) => { keepBookingDraft(); B.type = Number(el.dataset.id); B.slot = null; CF.refresh(); });
  on("bprov", (el) => { keepBookingDraft(); B.provider = el.value; B.slot = null; CF.refresh(); });
  on("booking-provider-query", (el) => {
    B.providerQuery = el.value;
    const select = document.getElementById("bp");
    if (select) select.innerHTML = bookingProviderOptions();
  });
  on("bdate", (el) => { if (!el.value) return; keepBookingDraft(); B.date = el.value; B.slot = null; CF.refresh(); });
  on("bslot", (el) => {
    keepBookingDraft();
    B.slot = { start: el.dataset.s, provider_id: Number(el.dataset.p) };
    CF.refresh().then(() => (B.mode === "returning" && !B.patient ? document.getElementById("bps") : document.querySelector('form[data-form="staff-book"] input[name="patient_name"]:not([readonly]), form[data-form="staff-book"] input[name="reason"]'))?.focus());
  });
  on("returning-patient", () => {
    CF.modal(t("returning_patient"), `<form data-form="lookup-patient" class="stack">
      ${CF.field("query", t("lookup_patient"), { type: "search", required: true, attrs: 'minlength="2" autofocus' })}
      <button class="btn primary" type="submit">${t("search")}</button></form><div class="stack" id="patient-matches" aria-live="polite"></div>`);
  });
  onForm("lookup-patient", async (d) => {
    const { patients } = await api("GET", `/staff/patients?q=${encodeURIComponent(d.query)}`);
    B.matches = patients;
    const matches = document.getElementById("patient-matches");
    if (matches) matches.innerHTML = patients.map((p) => `<button type="button" class="choice" data-act="pick-booking-patient" data-id="${p.id}">
      <b>${esc(p.name)}</b><span class="small muted">${esc([p.phone, p.email].filter(Boolean).join(" · "))}</span></button>`).join("") || `<p>${t("no_returning_patients")}</p>`;
  });
  on("pick-booking-patient", (el) => {
    const p = B.matches.find((patient) => patient.id === Number(el.dataset.id));
    if (!p) return;
    keepBookingDraft();
    B.patient = p; B.mode = "returning";
    Object.assign(B.draft, { patient_name: p.name, phone: p.phone || "", email: p.email || "" });
    if (el.closest(".modal-wrap")) CF.closeModal();
    CF.refresh().then(() => document.querySelector('form[data-form="staff-book"] input[name="reason"]')?.focus());
  });
  on("new-booking-patient", () => {
    keepBookingDraft();
    B.patient = null;
    Object.assign(B.draft, { patient_name: "", phone: "", email: "" });
    CF.refresh().then(() => document.getElementById("bps")?.focus());
  });
  on("bmode", (el) => {
    if (B.mode === el.dataset.m) return;
    keepBookingDraft();
    B.mode = el.dataset.m; B.patient = null; B.matches = []; B.lookup = "";
    Object.assign(B.draft, { patient_name: "", phone: "", email: "" });
    CF.refresh().then(() => (B.mode === "returning" ? document.getElementById("bps") : document.querySelector('form[data-form="staff-book"] input[name="patient_name"]'))?.focus());
  });
  // Search returning patients as you type (name, phone or email) – results update without leaving the form.
  let bpT;
  on("bp-search", (el) => {
    B.lookup = el.value; clearTimeout(bpT);
    bpT = setTimeout(async () => {
      const q = B.lookup.trim();
      B.matches = q.length >= 2 ? (await api("GET", `/staff/patients?q=${encodeURIComponent(q)}`)).patients : [];
      if (q !== B.lookup.trim()) return; // a newer search is on its way
      const box = document.getElementById("bp-matches");
      if (box) box.innerHTML = patientMatchesHtml();
    }, 250);
  });
  onForm("staff-book", async (d) => {
    try {
      const { appointment: a } = await api("POST", "/staff/appointments", { ...d, patient_record: B.patient?.id, start: B.slot.start, provider_id: B.slot.provider_id, type_id: B.type, source: B.source });
      CF.toast(t("staff_booked", { name: a.patient_name, when: `${CF.relDay(a.start)} ${CF.fmtTime(a.start)}` }));
      B.slot = null; B.draft = {}; B.patient = null; B.lookup = ""; B.matches = []; CF.refresh();
    } catch (e) { CF.toast(CF.errMsg(e), "err"); B.slot = null; B.draft = d; CF.refresh(); }
  });

  // =====================================================================
  // WAITLIST
  // =====================================================================
  route("/staff/waitlist", { title: "nav_waitlist", roles: STAFF, live: true, render: async () => {
    await CF.meta();
    const { waitlist } = await api("GET", "/staff/waitlist");
    return `<section class="page"><header class="page-head"><h1>${t("nav_waitlist")}</h1><p class="muted">${t("waitlist_sub")}</p></header>
      <div class="table-wrap card"><table class="table"><thead><tr><th>#</th><th>${t("patient")}</th><th>${t("wanted")}</th><th>${t("contact")}</th><th>${t("status")}</th><th><span class="sr-only">${t("actions")}</span></th></tr></thead>
      <tbody>${waitlist.map((w, i) => `<tr><td>${i + 1}</td><td><b>${esc(w.patient_name)}</b></td><td>${w.date ? esc(CF.fmtShort(w.date)) : t("any_day")}${w.provider_name ? `<br/><span class="small muted">${esc(w.provider_name)}</span>` : ""}${w.type_en ? `<br/><span class="small muted">${esc(S.lang === "fr" ? w.type_fr : w.type_en)}</span>` : ""}</td>
        <td class="small">${esc(w.phone || "")}<br/>${esc(w.email || "")}</td><td>${w.status === "offered" ? CF.chip(t("offered_at", { when: CF.fmtShort(w.offer_start) + " " + CF.fmtTime(w.offer_start) }), "#2F80ED") : CF.chip(t("waiting_wl"), "#E0A100")}</td>
        <td class="row gap">${w.status === "waiting" ? `<button class="btn sm" data-act="wl-offer" data-id="${w.id}" data-date="${w.date || CF.ymd(new Date())}" data-p="${w.provider_id || ""}" data-type="${w.type_id || ""}">${t("offer_slot")}</button>` : ""}
          <button class="btn sm ghost danger-text" data-act="wl-remove" data-id="${w.id}" aria-label="${esc(t("remove") + " " + w.patient_name)}">${I("trash")}</button></td></tr>`).join("") || `<tr><td colspan="6">${CF.empty("hourglass", t("waitlist_empty"))}</td></tr>`}</tbody></table></div>
      <p class="small muted">${I("info")} ${t("waitlist_auto")}</p></section>`;
  } });
  on("wl-remove", async (el) => { if (await CF.confirm(t("remove_wl_q"), { danger: true, ok: t("remove") })) { await api("DELETE", `/staff/waitlist/${el.dataset.id}`); CF.refresh(); } });
  on("wl-offer", async (el) => {
    const load = async (date) => {
      const { slots } = await api("GET", `/clinics/${S.user.clinic_id}/slots?date=${date}${el.dataset.type ? `&type=${el.dataset.type}` : ""}${el.dataset.p ? `&provider=${el.dataset.p}` : ""}`);
      document.getElementById("wlslots").innerHTML = slots.map((s) => `<button class="slot" data-act="wl-offer-slot" data-id="${el.dataset.id}" data-s="${s.start}" data-p="${s.provider_id}">${esc(CF.fmtTime(s.start))}<small>${esc(s.provider_name)}</small></button>`).join("") || `<p class="muted">${t("no_slots")}</p>`;
    };
    const m = CF.modal(t("offer_slot"), `<div class="field"><label for="wld">${t("date")}</label><input type="date" id="wld" value="${el.dataset.date}" min="${CF.ymd(new Date())}"/></div><div id="wlslots" class="slots"></div>`);
    m.el.querySelector("#wld").onchange = (e) => load(e.target.value);
    load(el.dataset.date);
  });
  on("wl-offer-slot", async (el) => { await api("POST", `/staff/waitlist/${el.dataset.id}/offer`, { start: el.dataset.s, provider_id: Number(el.dataset.p) }); CF.closeModal(); CF.toast(t("offer_sent")); CF.refresh(); });

  // =====================================================================
  // MESSAGES (incl. conversations handed over by Clio)
  // =====================================================================
  let MU = null;
  route("/staff/messages", { title: "nav_messages", roles: STAFF, live: true, render: async (q) => {
    await CF.meta();
    if (q.u) MU = Number(q.u);
    const { threads } = await api("GET", "/staff/messages");
    if (!MU && threads[0]) MU = threads[0].user_id;
    const conv = MU ? await api("GET", `/staff/messages/${MU}`) : null;
    const tpl = META.templates;
    return `<section class="page wide"><header class="page-head"><h1>${t("nav_messages")}</h1></header>
      <div class="inbox">
        <ul class="threads card" aria-label="${esc(t("conversations"))}">${threads.map((th) => `<li><button class="thread ${th.user_id === MU ? "active" : ""}" data-act="open-thread" data-u="${th.user_id}" ${th.user_id === MU ? 'aria-current="true"' : ""}>
          <span class="row between"><b>${esc(th.first_name)} ${esc(th.last_name)}</b>${th.unread ? `<span class="badge">${th.unread}</span>` : ""}</span>
          <span class="small muted clamp">${esc(th.last_body)}</span></button></li>`).join("") || `<li class="muted">${t("no_messages")}</li>`}</ul>
        ${conv ? `<div class="card conv"><div class="row between wrap"><h2>${esc(conv.patient.first_name)} ${esc(conv.patient.last_name)}</h2>
            <span class="row gap">${conv.patient.phone ? `<a class="btn sm" href="tel:${esc(conv.patient.phone)}">${I("phone")} ${t("call")}</a>` : ""}<a class="btn sm ghost" href="mailto:${esc(conv.patient.email)}" aria-label="${esc(t("email") + " " + conv.patient.email)}">${I("mail")}</a></span></div>
          <div class="chat" aria-live="polite">${conv.messages.map((m) => `<div class="bubble ${m.sender === "staff" ? "me" : m.sender}"><span class="who">${m.sender === "staff" ? t("clinic") : esc(conv.patient.first_name)}</span><p>${esc(m.body).replace(/\n/g, "<br/>")}</p><time>${esc(CF.fmtShort(m.created_at))} ${esc(CF.fmtTime(m.created_at))}</time></div>`).join("")}</div>
          <div class="chips-row">${tpl.filter((x) => ["reminder", "forms_due", "status_update"].includes(x.key)).map((x) => `<button class="chip-btn" data-act="insert-tpl" data-k="${x.key}">${t("tpl_" + x.key)}</button>`).join("")}</div>
          <form data-form="staff-msg" class="row gap compose"><label class="sr-only" for="smb">${t("message")}</label><textarea id="smb" name="body" rows="2" required placeholder="${esc(t("write_message"))}"></textarea><button class="btn primary" type="submit" aria-label="${esc(t("send"))}">${I("send")}</button></form></div>`
          : `<div class="card">${CF.empty("msg", t("no_messages"))}</div>`}
      </div></section>`;
  }, after: () => { const c = document.querySelector(".conv .chat"); if (c) c.scrollTop = c.scrollHeight; } });
  on("open-thread", (el) => { MU = Number(el.dataset.u); CF.go("/staff/messages?u=" + MU); });
  on("insert-tpl", (el) => { const x = META.templates.find((x) => x.key === el.dataset.k); const ta = document.getElementById("smb"); ta.value = (S.lang === "fr" ? x.body_fr : x.body_en).replace("{clinic}", META.clinic.name); ta.focus(); });
  onForm("staff-msg", async (d) => { await api("POST", `/staff/messages/${MU}`, d); CF.refresh(); });
})();

</script>
  <script>
/* ClinicFlow – clinic administration dashboard (clinic manager settings). */
(function () {
  const { t, esc, icon: I, api, on, onForm, route, state: S } = CF;
  const TABS = [["insights", "chart"], ["clinic", "building"], ["providers", "steth"], ["staff", "users"], ["rules", "settings"], ["statuses", "queue"], ["templates", "mail"], ["outbox", "send"], ["audit", "shield"]];

  route("/admin", { title: "nav_admin", roles: ["admin"], render: async (q) => {
    const tab = TABS.find((x) => x[0] === q.tab) ? q.tab : "insights";
    const M = await CF.meta(true);
    const body = await { insights, clinic, providers, staff, rules, statuses, templates, outbox, audit }[tab](M);
    return `<section class="page wide"><header class="page-head"><h1>${t("nav_admin")}</h1><p class="muted">${esc(M.clinic.name)}</p></header>
      <div class="tabs" role="tablist" aria-label="${esc(t("nav_admin"))}">${TABS.map(([k, ic]) => `<a role="tab" href="#/admin?tab=${k}" aria-selected="${k === tab}" class="${k === tab ? "active" : ""}">${I(ic)} ${t("adm_" + k)}</a>`).join("")}</div>
      <div role="tabpanel">${body}</div></section>`;
  } });
  const reload = () => CF.refresh();

  // ---------- insights ----------
  async function insights(M) {
    const [s, { staff }] = await Promise.all([api("GET", "/admin/stats"), api("GET", "/admin/staff")]);
    const pct = (n) => (s.total ? Math.round((n / s.total) * 100) : 0);
    const bar = (label, n, color) => `<div class="hbar"><span>${label}</span><div><i style="width:${pct(n)}%;background:${color}"></i></div><b>${n} (${pct(n)}%)</b></div>`;
    return `<div class="kpis">
      <div class="kpi" style="--c:#0E6F66"><b>${s.total}</b><span>${t("bookings_30d")}</span></div>
      <div class="kpi" style="--c:#2F80ED"><b>${pct(s.online)}%</b><span>${t("booked_online")}</span></div>
      <div class="kpi" style="--c:#E0A100"><b>${s.avg_wait} min</b><span>${t("avg_wait_room")}</span></div>
      <div class="kpi" style="--c:#8E44AD"><b>${s.waitlist_filled}</b><span>${t("filled_from_waitlist")}</span></div>
      <div class="kpi" style="--c:#C0392B"><b>${s.cancelled}</b><span>${t("cancellations")}</span></div></div>
      <div class="card stack"><h2>${t("how_patients_book")}</h2>${bar(t("src_online"), s.online, "#2F80ED")}${bar(t("src_phone"), s.phone, "#E0A100")}${bar(t("src_in_person"), s.in_person, "#8E44AD")}</div>
      <div class="card"><h2>${t("setup_checklist")}</h2><ul class="checklist">
        ${[[M.providers.some((p) => p.active && p.avail.length), "providers", "chk_providers"], [!!M.clinic.photo, "clinic", "chk_photo"], [M.clinic.accepting_online, "clinic", "chk_online"], [staff.some((u) => u.id !== S.user.id), "staff", "chk_staff"], [M.templates.some((x) => x.reviewed_at), "templates", "chk_templates"]]
          .map(([ok, tab, k]) => `<li class="${ok ? "ok" : ""}">${I(ok ? "check" : "info")} <a href="#/admin?tab=${tab}">${t(k)}</a></li>`).join("")}</ul></div>`;
  }

  // ---------- clinic page ----------
  async function clinic(M) {
    const c = M.clinic;
    return `<form data-form="adm-clinic" class="card stack">
      <h2>${t("clinic_page")}</h2><p class="hint">${t("clinic_page_d")}</p>
      <div class="grid2">${CF.field("name", t("clinic_name"), { value: c.name, required: true })}${CF.field("phone", t("clinic_phone"), { type: "tel", value: c.phone })}</div>
      <div class="grid2">${CF.field("address", t("address"), { value: c.address })}${CF.field("city", t("city"), { value: c.city })}</div>
      <div class="grid2">${CF.field("postal", t("postal"), { value: c.postal })}${CF.field("email", t("email"), { type: "email", value: c.email })}</div>
      ${CF.field("photo", t("photo_url"), { type: "url", value: c.photo || "", hint: t("photo_url_hint") })}
      <div class="grid2"><div class="field"><label for="den">${t("description")} (EN)</label><textarea id="den" name="description_en" rows="3">${esc(c.description_en || "")}</textarea></div>
        <div class="field"><label for="dfr">${t("description")} (FR)</label><textarea id="dfr" name="description_fr" rows="3" lang="fr">${esc(c.description_fr || "")}</textarea></div></div>
      <fieldset><legend class="label">${t("hours")}</legend><div class="hours-edit">${[1, 2, 3, 4, 5, 6, 0].map((d) => { const h = c.hours[d]; return `<div class="row gap wrap">
        <label class="pill"><input type="checkbox" name="open_${d}" ${h ? "checked" : ""}/><span>${esc(CF.dayName(d))}</span></label>
        <label class="sr-only" for="o${d}">${t("opens")}</label><input id="o${d}" type="time" name="from_${d}" value="${h ? h[0] : "09:00"}"/> – <label class="sr-only" for="c${d}">${t("closes")}</label><input id="c${d}" type="time" name="to_${d}" value="${h ? h[1] : "17:00"}"/></div>`; }).join("")}</div></fieldset>
      <div class="switch-row"><div><b id="lbl_online">${t("accept_online")}</b><p class="muted">${t("accept_online_d")}</p></div><label class="pill"><input type="checkbox" name="accepting_online" ${c.accepting_online ? "checked" : ""} aria-labelledby="lbl_online"/><span>${t("on")}</span></label></div>
      <button class="btn primary" type="submit">${t("save")}</button></form>`;
  }
  onForm("adm-clinic", async (d) => {
    const hours = {};
    [0, 1, 2, 3, 4, 5, 6].forEach((x) => { if (d["open_" + x]) hours[x] = [d["from_" + x], d["to_" + x]]; });
    await api("PATCH", "/admin/clinic", { ...d, hours, accepting_online: !!d.accepting_online });
    CF.toast(t("saved")); reload();
  });

  // ---------- providers, availability & schedule blocks ----------
  async function providers(M) {
    return `<div class="stack">${M.providers.map((p) => `<details class="card" ${M.providers.length < 4 ? "" : ""}><summary class="row between"><span><b>${esc(p.name)}</b> · ${esc(p.specialty || "")} ${p.active ? "" : CF.chip(t("inactive"), "#7F8C8D")}</span>
        <span class="small muted">${p.avail.map((a) => esc(CF.dayName(a.weekday, "short"))).join(" ")}</span></summary>
      <form data-form="adm-avail" data-id="${p.id}" class="stack"><h3>${t("availability")}</h3>
        ${[1, 2, 3, 4, 5, 6, 0].map((d) => { const a = p.avail.find((x) => x.weekday === d); return `<div class="row gap wrap"><label class="pill"><input type="checkbox" name="on_${d}" ${a ? "checked" : ""}/><span>${esc(CF.dayName(d))}</span></label>
          <input type="time" name="s_${d}" value="${a ? a.start : "09:00"}" aria-label="${esc(CF.dayName(d) + " " + t("from"))}"/> – <input type="time" name="e_${d}" value="${a ? a.end : "17:00"}" aria-label="${esc(CF.dayName(d) + " " + t("to"))}"/></div>`; }).join("")}
        <button class="btn sm primary" type="submit">${t("save_availability")}</button></form>
      <form data-form="adm-prov" data-id="${p.id}" class="stack"><h3>${t("profile")}</h3>
        <div class="grid2">${CF.field("name", t("full_name"), { value: p.name })}${CF.field("specialty", t("specialty"), { value: p.specialty || "" })}</div>
        <div class="grid2">${CF.field("title", t("title_cred"), { value: p.title || "" })}${CF.field("languages", t("languages"), { value: p.languages || "" })}</div>
        <label class="pill"><input type="checkbox" name="active" ${p.active ? "checked" : ""}/><span>${t("active_bookable")}</span></label>
        <button class="btn sm" type="submit">${t("save")}</button></form></details>`).join("")}
      <form data-form="adm-new-prov" class="card row gap wrap end"><h2 class="grow-full">${I("plus")} ${t("add_provider")}</h2>${CF.field("name", t("full_name"), { required: true })}${CF.field("specialty", t("specialty"))}<button class="btn primary" type="submit">${t("add")}</button></form>
      <section class="card stack"><h2>${t("schedule_blocks")}</h2><p class="hint">${t("schedule_blocks_d")}</p>
        <ul class="plain-list">${M.blocks.map((b) => `<li class="row between"><span><b>${esc(b.provider_name)}</b> · ${esc(CF.fmtShort(b.date))} ${esc(CF.fmtTime(b.start))}–${esc(CF.fmtTime(b.end))} · ${esc(b.reason || "")}</span><button class="btn sm ghost danger-text" data-act="del-block" data-id="${b.id}" aria-label="${esc(t("remove"))}">${I("trash")}</button></li>`).join("") || `<li class="muted">${t("none")}</li>`}</ul>
        <form data-form="adm-block" class="row gap wrap end"><div class="field"><label for="bkp">${t("provider")}</label><select id="bkp" name="provider_id">${M.providers.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div>
          ${CF.field("date", t("date"), { type: "date", required: true, value: CF.ymd(new Date()) })}${CF.field("start", t("from"), { type: "time", value: "12:00", required: true })}${CF.field("end", t("to"), { type: "time", value: "13:00", required: true })}${CF.field("reason", t("block_reason"))}
          <button class="btn" type="submit">${I("plus")} ${t("block_time")}</button></form></section></div>`;
  }
  onForm("adm-avail", async (d, f) => {
    const availability = [0, 1, 2, 3, 4, 5, 6].filter((x) => d["on_" + x]).map((x) => ({ weekday: x, start: d["s_" + x], end: d["e_" + x] }));
    await api("PUT", `/admin/providers/${f.dataset.id}/availability`, { availability }); CF.toast(t("saved")); reload();
  });
  onForm("adm-prov", async (d, f) => { await api("PATCH", `/admin/providers/${f.dataset.id}`, { ...d, active: !!d.active }); CF.toast(t("saved")); reload(); });
  onForm("adm-new-prov", async (d) => { await api("POST", "/admin/providers", d); CF.toast(t("provider_added")); reload(); });
  onForm("adm-block", async (d) => { await api("POST", "/admin/blocks", d); CF.toast(t("saved")); reload(); });
  on("del-block", async (el) => { await api("DELETE", `/admin/blocks/${el.dataset.id}`); reload(); });

  // ---------- staff & roles ----------
  async function staff(M) {
    const { staff } = await api("GET", "/admin/staff");
    const roles = ["reception", "nurse", "practitioner", "admin"];
    const roleOptions = (selected) => roles.map((role) => `<option value="${role}" ${role === selected ? "selected" : ""}>${t("role_" + role)}</option>`).join("");
    const providers = (selected) => `<option value="">${t("none")}</option>` + M.providers.filter((p) => p.active || p.id === selected)
      .map((p) => `<option value="${p.id}" ${p.id === selected ? "selected" : ""}>${esc(p.name)}</option>`).join("");
    return `<div class="card"><h2>${t("staff_roles")}</h2><p class="hint">${t("staff_roles_d")}</p>
      <div class="table-wrap"><table class="table"><thead><tr><th>${t("full_name")}</th><th>${t("email")}</th><th>${t("role")}</th><th><span class="sr-only">${t("actions")}</span></th></tr></thead><tbody>
      ${staff.map((u) => `<tr><td><b>${esc(u.first_name)} ${esc(u.last_name)}</b>${u.id === S.user.id ? ` <span class="muted small">(${t("you")})</span>` : ""}</td><td>${esc(u.email)}</td>
        <td>${u.id === S.user.id ? t("role_admin") : `<form data-form="set-role" data-id="${u.id}" class="stack">
          <label class="sr-only" for="r${u.id}">${t("role")}</label><select id="r${u.id}" name="staff_role">${roleOptions(u.staff_role)}</select>
          <label for="staff-provider-${u.id}" class="small">${t("staff_provider")}</label><select id="staff-provider-${u.id}" name="provider_id">${providers(u.provider_id)}</select>
          <button class="btn sm" type="submit">${t("save")}</button></form>`}</td>
        <td>${u.id === S.user.id ? "" : `<button class="btn sm ghost danger-text" data-act="del-staff" data-id="${u.id}" aria-label="${esc(t("remove") + " " + u.first_name)}">${I("trash")}</button>`}</td></tr>`).join("")}</tbody></table></div>
      <dl class="role-help">${roles.map((r) => `<div><dt>${t("role_" + r)}</dt><dd>${t("role_" + r + "_d")}</dd></div>`).join("")}</dl></div>
      <form data-form="adm-staff" class="card stack"><h2>${I("plus")} ${t("add_staff")}</h2>
        <div class="grid2">${CF.field("first_name", t("first_name"), { required: true })}${CF.field("last_name", t("last_name"))}</div>
        <div class="grid2">${CF.field("email", t("email"), { type: "email", required: true, auto: "off" })}${CF.field("password", t("temp_password"), { type: "text", required: true, attrs: 'minlength="8"', hint: t("temp_password_hint") })}</div>
        <div class="grid2"><div class="field"><label for="nsr">${t("role")}</label><select id="nsr" name="staff_role">${roleOptions("reception")}</select></div>
          <div class="field"><label for="new-staff-provider">${t("staff_provider")}</label><select id="new-staff-provider" name="provider_id">${providers()}</select></div></div>
        <button class="btn primary" type="submit">${t("add_staff")}</button></form>`;
  }
  onForm("set-role", async (d, form) => { await api("PATCH", `/admin/staff/${form.dataset.id}`, d); CF.toast(t("saved")); reload(); });
  on("del-staff", async (el) => { if (await CF.confirm(t("remove_staff_q"), { danger: true, ok: t("remove") })) { await api("DELETE", `/admin/staff/${el.dataset.id}`); reload(); } });
  onForm("adm-staff", async (d) => { await api("POST", "/admin/staff", d); CF.toast(t("staff_added")); reload(); });

  // ---------- booking rules & visit types ----------
  async function rules(M) {
    return `<form data-form="adm-rules" class="card stack"><h2>${t("booking_rules")}</h2>
      <div class="grid2">${CF.field("cancel_hours", t("cancel_limit"), { type: "number", value: M.clinic.cancel_hours, attrs: 'min="0" max="168"', hint: t("cancel_limit_hint") })}
        ${CF.field("slot_minutes", t("slot_step"), { type: "number", value: M.clinic.slot_minutes, attrs: 'min="5" max="60" step="5"', hint: t("slot_step_hint") })}</div>
      <button class="btn primary" type="submit">${t("save")}</button></form>
      <div class="card stack"><h2>${t("visit_types")}</h2><p class="hint">${t("visit_types_d")}</p>
        ${M.types.map((ty) => `<form data-form="adm-type" data-id="${ty.id}" class="row gap wrap end type-row" style="--c:${esc(ty.color)}">
          ${CF.field("name_en", t("name") + " (EN)", { value: ty.name_en })}${CF.field("name_fr", t("name") + " (FR)", { value: ty.name_fr })}
          ${CF.field("minutes", t("minutes"), { type: "number", value: ty.minutes, attrs: 'min="5" max="240" step="5"' })}
          <div class="field"><label for="tc${ty.id}">${t("colour")}</label><input id="tc${ty.id}" type="color" name="color" value="${esc(ty.color)}"/></div>
          <button class="btn sm" type="submit">${t("save")}</button><button type="button" class="btn sm ghost danger-text" data-act="del-type" data-id="${ty.id}" aria-label="${esc(t("remove"))}">${I("trash")}</button></form>`).join("")}
        <form data-form="adm-new-type" class="row gap wrap end">${CF.field("name_en", t("name") + " (EN)", { required: true })}${CF.field("name_fr", t("name") + " (FR)")}${CF.field("minutes", t("minutes"), { type: "number", value: 15 })}
          <div class="field"><label for="ntc">${t("colour")}</label><input id="ntc" type="color" name="color" value="#16A085"/></div><button class="btn" type="submit">${I("plus")} ${t("add")}</button></form></div>`;
  }
  onForm("adm-rules", async (d) => { await api("PATCH", "/admin/clinic", d); CF.toast(t("saved")); reload(); });
  onForm("adm-type", async (d, f) => { await api("PATCH", `/admin/types/${f.dataset.id}`, d); CF.toast(t("saved")); reload(); });
  onForm("adm-new-type", async (d) => { await api("POST", "/admin/types", d); CF.toast(t("saved")); reload(); });
  on("del-type", async (el) => { try { await api("DELETE", `/admin/types/${el.dataset.id}`); reload(); } catch (e) { CF.toast(CF.errMsg(e), "err"); } });

  // ---------- custom statuses ----------
  async function statuses(M) {
    return `<div class="card stack"><h2>${t("patient_statuses")}</h2><p class="hint">${t("patient_statuses_d")}</p>
      ${M.statuses.map((s) => `<form data-form="adm-status" data-id="${s.id}" class="row gap wrap end">
        <span class="chip" style="--c:${esc(s.color)}"><span class="dot"></span>${esc(CF.L(s, "label"))}</span>
        ${CF.field("label_en", "EN", { value: s.label_en })}${CF.field("label_fr", "FR", { value: s.label_fr })}
        ${CF.field("sort", t("order"), { type: "number", value: s.sort, attrs: 'min="1" max="99" style="width:5rem"' })}
        <div class="field"><label for="sc${s.id}">${t("colour")}</label><input id="sc${s.id}" type="color" name="color" value="${esc(s.color)}"/></div>
        <button class="btn sm" type="submit">${t("save")}</button>${s.system ? `<span class="small muted">${t("built_in")}</span>` : `<button type="button" class="btn sm ghost danger-text" data-act="del-status" data-id="${s.id}" aria-label="${esc(t("remove"))}">${I("trash")}</button>`}</form>`).join("")}
      <form data-form="adm-new-status" class="row gap wrap end"><h3 class="grow-full">${I("plus")} ${t("add_status")}</h3>${CF.field("label_en", "EN", { required: true, hint: t("status_example") })}${CF.field("label_fr", "FR")}
        <div class="field"><label for="nsc">${t("colour")}</label><input id="nsc" type="color" name="color" value="#16A085"/></div><button class="btn" type="submit">${t("add")}</button></form></div>`;
  }
  onForm("adm-status", async (d, f) => { await api("PATCH", `/admin/statuses/${f.dataset.id}`, d); CF.toast(t("saved")); reload(); });
  onForm("adm-new-status", async (d) => { try { await api("POST", "/admin/statuses", d); CF.toast(t("saved")); reload(); } catch (e) { CF.toast(CF.errMsg(e), "err"); } });
  on("del-status", async (el) => { try { await api("DELETE", `/admin/statuses/${el.dataset.id}`); reload(); } catch (e) { CF.toast(CF.errMsg(e), "err"); } });

  // ---------- message & form templates ----------
  async function templates(M) {
    const ft = M.form_templates[0];
    return `<div class="card stack"><h2>${t("message_templates")}</h2><p class="hint">${t("message_templates_d")}</p>
      ${M.templates.map((x) => `<form data-form="adm-tpl" data-k="${x.key}" class="stack tpl"><h3>${t("tpl_" + x.key)}</h3>
        <div class="grid2"><div class="field"><label for="te${x.key}">English</label><textarea id="te${x.key}" name="body_en" rows="2">${esc(x.body_en)}</textarea></div>
        <div class="field"><label for="tf${x.key}">Français</label><textarea id="tf${x.key}" name="body_fr" rows="2" lang="fr">${esc(x.body_fr)}</textarea></div></div>
        <button class="btn sm" type="submit">${t("save")}</button></form>`).join("")}</div>
      ${ft ? `<form data-form="adm-form-tpl" data-id="${ft.id}" class="card stack"><h2>${t("previsit_form")}</h2><p class="hint">${t("previsit_form_d")}</p>
        <div class="grid2">${CF.field("title_en", t("title") + " (EN)", { value: ft.title_en })}${CF.field("title_fr", t("title") + " (FR)", { value: ft.title_fr })}</div>
        ${[...JSON.parse(ft.fields), {}, {}].map((q, i) => `<div class="grid2">${CF.field("q_en_" + i, `${t("question")} ${i + 1} (EN)`, { value: q.en || "" })}${CF.field("q_fr_" + i, `${t("question")} ${i + 1} (FR)`, { value: q.fr || "" })}</div>`).join("")}
        <p class="small muted">${I("shield")} ${t("form_privacy_admin")}</p><button class="btn primary" type="submit">${t("save")}</button></form>` : ""}`;
  }
  onForm("adm-tpl", async (d, f) => { await api("PUT", `/admin/templates/${f.dataset.k}`, d); CF.toast(t("saved")); });
  onForm("adm-form-tpl", async (d, f) => {
    const fields = []; for (let i = 0; i < 20; i++) if (d["q_en_" + i]) fields.push({ id: "q" + (i + 1), en: d["q_en_" + i], fr: d["q_fr_" + i] });
    await api("PUT", `/admin/form-templates/${f.dataset.id}`, { title_en: d.title_en, title_fr: d.title_fr, fields }); CF.toast(t("saved")); reload();
  });

  // ---------- access log (who opened or changed which appointment record) ----------
  async function audit() {
    const { audit, agreement } = await api("GET", "/admin/audit");
    return `<div class="card"><h2>${t("access_log")}</h2><p class="hint">${t("access_log_d")}</p>
      ${agreement ? `<p class="small">${I("check")} ${t("clinic_agreement_on_file", { date: esc(CF.fmtDate(agreement.slice(0, 10), { year: "numeric", month: "long", day: "numeric" })) })}</p>` : ""}
      <div class="table-wrap"><table class="table"><thead><tr><th>${t("when")}</th><th>${t("staff_member")}</th><th>${t("action")}</th><th>${t("patient")}</th></tr></thead><tbody>
      ${audit.map((a) => `<tr><td class="small">${esc(CF.fmtShort(a.created_at))} ${esc(CF.fmtTime(a.created_at))}</td><td>${esc(a.staff_name)}</td><td>${t("au_" + a.action)}</td><td>${esc(a.patient_name || "")}</td></tr>`).join("") || `<tr><td colspan="4">${t("none")}</td></tr>`}</tbody></table></div></div>`;
  }

  // ---------- notification outbox ----------
  async function outbox() {
    const { outbox, demoMode } = await api("GET", "/admin/outbox");
    return `<div class="card"><h2>${t("outbox")}</h2>${demoMode ? `<div class="notice info">${I("info")} ${t("outbox_demo")}</div>` : ""}
      <div class="table-wrap"><table class="table"><thead><tr><th>${t("when")}</th><th>${t("channel")}</th><th>${t("to")}</th><th>${t("message")}</th><th>${t("status")}</th></tr></thead><tbody>
      ${outbox.map((o) => `<tr><td class="small">${esc(CF.fmtShort(o.created_at))} ${esc(CF.fmtTime(o.created_at))}</td><td>${I({ email: "mail", sms: "msg", call: "phone" }[o.channel] || "bell")} ${t("via_" + o.channel)}</td><td class="small">${esc(o.recipient)}</td><td class="small">${esc(o.body)}</td>
        <td>${CF.chip(t("ob_" + o.status), { sent: "#27AE60", demo: "#5B7FA6", failed: "#C0392B" }[o.status])}</td></tr>`).join("") || `<tr><td colspan="5">${t("none")}</td></tr>`}</tbody></table></div></div>`;
  }
})();

</script>
  <script>
/* ClinicFlow – legal & privacy layer: first-visit consent (Terms, Privacy, Cookies), cookie settings,
   legal pages, footer, staff confidentiality agreement and consent records. */
(function () {
  const { t, esc, icon: I, api, on, route, state: S } = CF;
  const V = window.LEGAL_VERSION;
  const DOCS = ["terms", "privacy", "cookies", "accessibility"];

  // ---------- documents ----------
  const contact = () => esc(S.config.privacyEmail || t("privacy_contact_fallback"));
  CF.legalDoc = (key, { headingLevel = 1 } = {}) => {
    const d = window.LEGAL[key][S.lang] || window.LEGAL[key].en;
    const fill = (s) => esc(s).replace(/\{email\}/g, `<b>${contact()}</b>`);
    const h = headingLevel, h2 = Math.min(h + 1, 6);
    const body = d.sections.map(([title, paras]) => {
      let html = `<h${h2}>${esc(title)}</h${h2}>`, list = [];
      const flush = () => { if (list.length) { html += `<ul>${list.map((li) => `<li>${fill(li)}</li>`).join("")}</ul>`; list = []; } };
      paras.forEach((p) => { if (p.startsWith("• ")) list.push(p.slice(2)); else { flush(); html += `<p>${fill(p)}</p>`; } });
      flush();
      return html;
    }).join("");
    return `<article class="legal-doc" lang="${S.lang === "fr" ? "fr-CA" : "en-CA"}"><h${h}>${esc(d.title)}</h${h}><p class="updated">${t("last_updated")}: ${esc(CF.fmtDate(V, { year: "numeric", month: "long", day: "numeric" }))}</p><p class="lead">${fill(d.intro)}</p>${body}</article>`;
  };
  const docLink = (k) => `<a href="#/legal/${k}">${esc((window.LEGAL[k][S.lang] || window.LEGAL[k].en).title)}</a>`;
  CF.docLink = docLink;

  // ---------- public legal pages ----------
  DOCS.forEach((k) => route("/legal/" + k, { title: "legal_" + k, render: () => `<section class="page">
      <nav class="legal-tabs" aria-label="${esc(t("legal_docs"))}">${DOCS.map((x) => `<a class="pill ${x === k ? "on" : ""}" href="#/legal/${x}" ${x === k ? 'aria-current="page"' : ""}>${esc((window.LEGAL[x][S.lang] || window.LEGAL[x].en).title)}</a>`).join("")}</nav>
      <div class="card">${CF.legalDoc(k)}</div>
      ${k === "cookies" ? `<button class="btn primary" data-act="cookie-settings">${I("settings")} ${t("cookie_settings")}</button>` : ""}
      <p class="small muted">${t("legal_versions_note")}</p></section>` }));

  // ---------- footer ----------
  CF.renderFooter = () => {
    const f = document.getElementById("footer");
    if (!f) return;
    f.innerHTML = `<nav aria-label="${esc(t("legal_docs"))}">${DOCS.map(docLink).join("")}<button class="link" data-act="cookie-settings">${t("cookie_settings")}</button></nav>
      <p><span class="sos">${I("alert")} ${t("footer_emergency")}</span> · ${t("footer_not_medical")}</p>
      <p>© 2026 Call 4 Action · ${t("footer_team")}</p>`;
  };

  // ---------- consent storage ----------
  CF.consent = () => CF.store.get("consent", null);
  const consentValid = () => { const c = CF.consent(); return !!(c && c.v === V && Date.now() - (c.at || 0) < 365 * 86400000); };
  function saveConsent(prefs) {
    CF.store.set("consent", { v: V, at: Date.now(), prefs: !!prefs });
    if (prefs) { CF.store.set("lang", S.lang); CF.store.set("a11y", S.a11y); } else CF.store.clearPrefs();
  }
  CF.recordServerConsent = async () => {
    if (S.user && consentValid() && S.user.consent_version !== V) {
      try { const r = await api("POST", "/me/consent", { kinds: ["terms", "privacy"], method: "consent_screen" }); S.user = r.user; } catch {}
    }
  };

  // ---------- first-visit consent screen (Terms + Privacy + Cookies) ----------
  let declined = false;
  CF.showGate = () => {
    if (document.querySelector(".gate-wrap")) return;
    const wrap = document.createElement("div");
    wrap.className = "gate-wrap";
    wrap.innerHTML = gateHTML();
    document.body.appendChild(wrap);
    document.querySelectorAll("body > :not(.gate-wrap):not(script)").forEach((el) => el.setAttribute("inert", ""));
    setTimeout(() => wrap.querySelector("h1")?.focus(), 30);
  };
  const closeGate = () => {
    document.querySelector(".gate-wrap")?.remove();
    document.querySelectorAll("[inert]").forEach((el) => el.removeAttribute("inert"));
  };
  function gateHTML() {
    if (declined) return `<div class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-t"><div class="gate-head"><h1 id="gate-t" tabindex="-1">${I("info")} ${t("gate_declined_title")}</h1></div>
      <div class="gate-body"><p>${t("gate_declined_1")}</p><p>${t("gate_declined_2")}</p><p class="sos small">${I("alert")} ${t("footer_emergency")}</p></div>
      <div class="gate-foot"><button class="btn primary" data-act="gate-review">${t("gate_review")}</button></div></div>`;
    return `<div class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-t" aria-describedby="gate-d">
      <div class="gate-head"><h1 id="gate-t" tabindex="-1">${I("shield")} ${t("gate_title")}</h1>
        <p id="gate-d" class="muted">${t("gate_intro")}</p>
        <button class="btn sm ghost" data-act="lang" lang="${S.lang === "fr" ? "en" : "fr"}">${I("globe")} ${S.lang === "fr" ? "English" : "Français"}</button></div>
      <div class="gate-body">
        <ul class="key-points">${[1, 2, 3, 4, 5, 6].map((n) => `<li>${t("gate_p" + n)}</li>`).join("")}</ul>
        ${["terms", "privacy", "cookies"].map((k) => `<details><summary><b>${t("read_full")} ${esc((window.LEGAL[k][S.lang] || window.LEGAL[k].en).title)}</b></summary>${CF.legalDoc(k, { headingLevel: 2 })}</details>`).join("")}
        <div class="cookie-cat"><div><b>${t("ck_essential")}</b><p>${t("ck_essential_d")}</p></div><span class="chip chip-soft" style="--c:#0E6F66">${t("always_on")}</span></div>
        <div class="cookie-cat"><div><b id="gp-l">${t("ck_prefs")}</b><p>${t("ck_prefs_d")}</p></div>
          <button class="switch" role="switch" aria-checked="false" aria-labelledby="gp-l" data-act="gate-prefs"><span></span></button></div>
        <p class="small muted">${t("gate_note")}</p>
      </div>
      <div class="gate-foot"><button class="btn ghost" data-act="gate-decline">${t("gate_decline")}</button><button class="btn primary" data-act="gate-accept">${I("check")} ${t("gate_accept")}</button></div></div>`;
  }
  const rerenderGate = (CF.refreshGate = () => { const w = document.querySelector(".gate-wrap"); if (w) { w.innerHTML = gateHTML(); w.querySelector("h1")?.focus(); } });
  on("gate-prefs", (el) => el.setAttribute("aria-checked", el.getAttribute("aria-checked") !== "true"));
  on("gate-accept", async () => {
    const prefs = document.querySelector('[data-act="gate-prefs"]')?.getAttribute("aria-checked") === "true";
    saveConsent(prefs);
    closeGate();
    await CF.recordServerConsent();
    CF.toast(t("consent_saved"), "ok", 3000);
    CF.render();
  });
  on("gate-decline", () => { declined = true; rerenderGate(); });
  on("gate-review", () => { declined = false; rerenderGate(); });
  document.addEventListener("keydown", (e) => {     // keep keyboard focus inside the consent screen
    const g = document.querySelector(".gate");
    if (!g || e.key !== "Tab") return;
    const f = [...g.querySelectorAll("a[href],button,summary,[tabindex='-1']")].filter((x) => x.offsetParent !== null && x.tabIndex >= -1);
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  CF.checkGate = () => { if (!consentValid()) CF.showGate(); };

  // ---------- cookie settings (from the footer, any time) ----------
  on("cookie-settings", () => {
    const c = CF.consent() || {};
    const m = CF.modal(t("cookie_settings"), `<p>${t("ck_intro")}</p>
      <div class="cookie-cat"><div><b>${t("ck_essential")}</b><p>${t("ck_essential_d")}</p></div><span class="chip chip-soft" style="--c:#0E6F66">${t("always_on")}</span></div>
      <div class="cookie-cat"><div><b id="cp-l">${t("ck_prefs")}</b><p>${t("ck_prefs_d")}</p></div><button class="switch" role="switch" aria-checked="${!!c.prefs}" aria-labelledby="cp-l" data-act="gate-prefs" id="cp-sw"><span></span></button></div>
      <p class="small">${docLink("cookies")} · ${docLink("privacy")}</p>
      <div class="row end gap"><button class="btn primary" data-act="cookie-save">${t("save")}</button></div>`);
  });
  on("cookie-save", () => {
    const prefs = document.getElementById("cp-sw").getAttribute("aria-checked") === "true";
    saveConsent(prefs);
    CF.closeModal();
    CF.toast(t("consent_saved"), "ok", 2500);
  });

  // ---------- staff confidentiality agreement (required before using staff screens) ----------
  route("/agreement", { title: "staff_agreement", roles: ["staff", "admin"], render: () => `<section class="page narrow">
      <div class="card">${CF.legalDoc("staff")}
      <form data-form="staff-agree" class="stack"><label class="check-row"><input type="checkbox" name="ok" required/> <span>${t("staff_agree_check")}</span></label>
        <button class="btn primary" type="submit">${I("check")} ${t("staff_agree_btn")}</button></form></div></section>` });
  CF.onForm("staff-agree", async () => {
    const r = await api("POST", "/me/staff-agreement");
    S.user = r.user;
    CF.toast(t("consent_saved"));
    CF.go(CF.homeFor(S.user));
  });
  CF.needsStaffAgreement = () => S.user && S.user.role !== "patient" && S.user.staff_agreement_version !== V;

  // ---------- consent checkboxes used on sign-up forms ----------
  CF.consentChecks = (clinic = false) => `<fieldset class="consent-checks"><legend class="sr-only">${t("consents")}</legend>
    ${clinic ? `<label class="check-row"><input type="checkbox" name="accept_clinic" required/> <span>${t("chk_clinic_agreement", { doc: `<a href="#/legal/clinic" data-act="show-doc" data-doc="clinic">${esc((window.LEGAL.clinic[S.lang] || window.LEGAL.clinic.en).title)}</a>` })}</span></label>` : ""}
    <label class="check-row"><input type="checkbox" name="accept_terms" required/> <span>${t("chk_terms", { terms: `<a href="#/legal/terms" data-act="show-doc" data-doc="terms">${esc(window.LEGAL.terms[S.lang].title)}</a>` })}</span></label>
    <label class="check-row"><input type="checkbox" name="accept_privacy" required/> <span>${t("chk_privacy", { privacy: `<a href="#/legal/privacy" data-act="show-doc" data-doc="privacy">${esc(window.LEGAL.privacy[S.lang].title)}</a>` })}</span></label>
    <p class="small muted">${t("chk_note")}</p></fieldset>`;
  on("show-doc", (el) => CF.modal(esc((window.LEGAL[el.dataset.doc][S.lang] || window.LEGAL[el.dataset.doc].en).title), CF.legalDoc(el.dataset.doc, { headingLevel: 3 }), { side: true, wide: true }));
  route("/legal/clinic", { title: "legal_clinic", render: () => `<section class="page"><div class="card">${CF.legalDoc("clinic")}</div></section>` });
})();

</script>
  <script>
/* Starts the app (kept in its own file so the strict security policy can block inline scripts). */
CF.start();

</script>
</body>
</html>
