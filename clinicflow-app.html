/* ClinicFlow – styles. Colour is used with purpose:
   teal = main actions/brand · status colours come from the clinic's settings · visit-type colours in calendars
   green/amber/red crowd levels (always with text + bar icon, never colour alone) · red = destructive / urgent. */
:root {
  /* Pastel palette from the Call 4 Action slides: white, periwinkle blue, sage green, indigo,
     and the slate blue-grey of the slide titles. The layout is unchanged. */
  --brand: #4A57B0; --brand-2: #6271C4; --brand-soft: #E7EBF8; --brand-deep: #343F8A;
  --signal: #BFE0C2; --signal-deep: #6FA37A; --signal-soft: #E7F3E6;
  --plate: #3C4680; --plate-2: #4D5A99;
  --ink: #2D3456; --ink-2: #44546A; --muted: #59627F;
  --bg: #F3F5FA; --card: #FFFFFF; --line: #D9DFEC; --focus: #2D3456;
  --route: linear-gradient(90deg, #9FB3E6, #B4C9E8 45%, #BFE0C2);
  --route-v: linear-gradient(180deg, #8EA3E0, #A9C3E3 50%, #A8D4AF);
  --blue: #4F74D0; --amber: #A66A00; --pink: #B8547F; --violet: #6B57C2; --green: #2F8A5A; --red: #C0352B;
  --quiet: #2A7A4F; --moderate: #8A5A10; --busy: #A93226;
  --r: 8px; --r-sm: 6px; --shadow: 0 1px 0 rgba(45, 52, 86, .05);
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Overpass", var(--font);
  --nav-w: 248px; --top-h: 64px;
}
html.hc { --plate: #000; --plate-2: #000; --brand-deep: #000; --signal: #FFD400; --route: linear-gradient(#000,#000); --route-v: linear-gradient(#000,#000); --brand: #0A2A9E; --brand-2: #0A2A9E; --brand-soft: #fff; --ink: #000; --ink-2: #000; --muted: #1a1a1a; --bg: #fff; --card: #fff; --line: #000; --focus: #B00020;
  --quiet: #0B5D36; --moderate: #7A4E00; --busy: #8E0000; }
html.hc .card, html.hc .btn, html.hc .chip, html.hc input, html.hc select, html.hc textarea { border-width: 2px !important; border-color: #000 !important; }
html.hc a { text-decoration: underline; }
html.spacing body { letter-spacing: .04em; word-spacing: .12em; line-height: 1.8; }
html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.5; font-size: 1rem; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.2; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.5rem, 2.6vw, 2rem); font-weight: 800; }
h2 { font-size: 1.2rem; font-weight: 700; } h3 { font-size: 1.05rem; font-weight: 700; } h4 { font-size: .95rem; }
p { margin: 0 0 .6em; }
a { color: var(--brand); text-underline-offset: 2px; }
img { max-width: 100%; }
hr { border: 0; border-top: 1px solid var(--line); margin: 1.2rem 0; }
code { background: var(--brand-soft); padding: .05em .35em; border-radius: 4px; }
.muted { color: var(--muted); } .small { font-size: .875rem; } .center { text-align: center; justify-content: center; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 1rem; top: -100px; z-index: 100; background: var(--ink); color: #fff; padding: .7rem 1rem; border-radius: 8px; }
.skip-link:focus { top: .6rem; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.2em; }

/* ---------- layout ---------- */
.topbar { position: sticky; top: 0; z-index: 30; height: var(--top-h); display: flex; align-items: center; gap: 1rem; padding: 0 1rem; background: var(--card); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: .55rem; font-family: var(--display); font-size: 1.3rem; color: var(--ink); text-decoration: none; font-weight: 600; }
.brand b { color: var(--brand); font-weight: 800; }
.logo { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: #fff; }
.logo .ic { width: 22px; height: 22px; stroke-width: 3; }
.logo.big { width: 56px; height: 56px; border-radius: 16px; } .logo.big .ic { width: 34px; height: 34px; }
.clinic-name { display: flex; gap: .4rem; align-items: center; color: var(--ink-2); font-weight: 700; font-size: .95rem; }
.top-actions { margin-left: auto; display: flex; gap: .35rem; align-items: center; }
.layout { display: flex; min-height: calc(100vh - var(--top-h)); }
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sidenav { width: var(--nav-w); flex: none; padding: 1rem .7rem; border-right: 1px solid var(--line); background: var(--card); position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); height: calc(100dvh - var(--top-h)); overflow: auto; overscroll-behavior-y: contain; }
.signed-out .sidenav, .signed-out .tabbar { display: none; }
.nav-link { display: flex; align-items: center; gap: .7rem; padding: .7rem .8rem; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 700; margin-bottom: 2px; min-height: 44px; }
.nav-link:hover { background: var(--bg); color: var(--ink); }
.nav-link.active { background: var(--brand-soft); color: var(--brand); }
.nav-link .badge { margin-left: auto; }
main { flex: 1; min-width: 0; padding: 1.5rem clamp(1rem, 3vw, 2.5rem) 2rem; outline: none; }
.page { max-width: 1040px; margin: 0 auto; }
.page.narrow { max-width: 720px; } .page.wide { max-width: 1400px; }
.page-head { margin-bottom: 1.2rem; gap: 1rem; }
.section-title { margin: 1.6rem 0 .7rem; display: flex; align-items: center; gap: .5rem; }
.section-title.inline { display: inline-flex; margin: 0; }
.count { font-size: .8rem; background: var(--line); color: var(--ink-2); border-radius: 99px; padding: .1rem .55rem; font-family: var(--font); }
.tabbar { display: none; }
@media (max-width: 860px) {
  .sidenav { display: none; }
  .tabbar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line); padding: .3rem .3rem calc(.3rem + env(safe-area-inset-bottom)); }
  .tab { flex: 1; min-width: 0; text-align: center; overflow-wrap: break-word; hyphens: auto; line-height: 1.15; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .35rem .2rem; font-size: .72rem; color: var(--ink-2); text-decoration: none; border-radius: 10px; position: relative; min-height: 48px; justify-content: center; font-weight: 700; }
  .tab.active { color: var(--brand); background: var(--brand-soft); } .tab .ic { width: 22px; height: 22px; }
  .tab .badge { position: absolute; top: 2px; right: 18%; }
  .hide-sm { display: none; }
  .clinic-name { display: none; }
  main { padding-bottom: 7rem; }
}

/* ---------- basics ---------- */
.row { display: flex; align-items: center; } .row.gap { gap: .6rem; } .row.wrap { flex-wrap: wrap; } .row.between { justify-content: space-between; } .row.end { justify-content: flex-end; align-items: flex-end; }
.grow { flex: 1; min-width: 0; } .grow-full { flex-basis: 100%; margin: 0; }
.stack > * + * { margin-top: .8rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
@media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } .page-head { gap: .65rem; margin-bottom: .9rem; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 1.1rem 1.2rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
details > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: .5rem; min-height: 32px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--red); color: #fff; font-size: .72rem; font-weight: 700; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 44px; padding: .55rem 1rem; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover { border-color: var(--brand-2); } .btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; } .btn.primary:hover { background: #0B5B54; }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; } .btn.sm { min-height: 36px; padding: .35rem .75rem; font-size: .9rem; border-radius: 10px; }
.btn.lg { min-height: 52px; padding: .7rem 1.4rem; font-size: 1.05rem; } .btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.danger-text { color: var(--red) !important; }
.link { background: none; border: 0; padding: 0; color: var(--brand); font: inherit; text-decoration: underline; cursor: pointer; }
.icon-btn { display: inline-flex; align-items: center; gap: .35rem; min-width: 44px; min-height: 44px; justify-content: center; border: 1px solid transparent; background: none; border-radius: 12px; color: var(--ink-2); font: inherit; font-weight: 700; cursor: pointer; position: relative; padding: 0 .5rem; }
.icon-btn:hover { background: var(--bg); color: var(--ink); }
.icon-btn .badge { position: absolute; top: 4px; right: 4px; }
.avatar { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 800; flex: none; }
.next-btn { background: color-mix(in srgb, var(--c) 12%, white); border-color: color-mix(in srgb, var(--c) 45%, white); color: color-mix(in srgb, var(--c) 55%, black); }
html.hc .next-btn { background: #fff; color: #000; }

/* ---------- chips / status ---------- */
.chip { display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .6rem; border-radius: 99px; font-size: .82rem; font-weight: 700; background: color-mix(in srgb, var(--c) 14%, white); color: color-mix(in srgb, var(--c) 55%, black); border: 1px solid color-mix(in srgb, var(--c) 35%, white); white-space: nowrap; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip-soft { background: color-mix(in srgb, var(--c) 9%, white); }
.crowd { display: inline-flex; align-items: center; gap: .4rem; font-weight: 700; font-size: .85rem; padding: .2rem .6rem; border-radius: 99px; }
.crowd .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.crowd .bars i { width: 4px; border-radius: 2px; background: currentColor; opacity: .25; }
.crowd .bars i:nth-child(1) { height: 6px; } .crowd .bars i:nth-child(2) { height: 10px; } .crowd .bars i:nth-child(3) { height: 14px; }
.crowd-quiet { color: var(--quiet); background: color-mix(in srgb, var(--quiet) 10%, white); } .crowd-quiet .bars i:nth-child(1) { opacity: 1; }
.crowd-moderate { color: var(--moderate); background: color-mix(in srgb, var(--moderate) 12%, white); } .crowd-moderate .bars i:nth-child(-n+2) { opacity: 1; }
.crowd-busy { color: var(--busy); background: color-mix(in srgb, var(--busy) 10%, white); } .crowd-busy .bars i { opacity: 1; }

/* visit progress tracker */
.tracker { list-style: none; display: flex; padding: 0; margin: .9rem 0; counter-reset: s; }
.tracker li { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; font-size: .78rem; color: var(--muted); }
.tracker li::before { content: ""; position: absolute; top: 13px; left: -50%; right: 50%; height: 3px; background: var(--line); z-index: 0; }
.tracker li:first-child::before { display: none; }
.tracker li.done::before, .tracker li.now::before { background: var(--brand-2); }
.tracker .node { position: relative; z-index: 1; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); font-weight: 800; font-size: .8rem; }
.tracker li.done .node { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
.tracker li.now .node { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.tracker li.now { color: var(--ink); font-weight: 700; }
.tracker .lbl { margin-top: .3rem; }

/* wait-time estimate */
.estimate { background: var(--bg); border-radius: var(--r-sm); padding: .8rem; }
.est-head { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-bottom: .6rem; font-size: .85rem; }
.est-bar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; gap: 2px; }
.seg.s1, .est-legend .s1 { background: #5B9BD5; } .seg.s2, .est-legend .s2 { background: #E0A100; } .seg.s3, .est-legend .s3 { background: #8E44AD; } .seg.s4, .est-legend .s4 { background: #27AE60; }
.est-legend { list-style: none; padding: 0; margin: .6rem 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .3rem .8rem; font-size: .85rem; }
.est-legend li { display: flex; align-items: center; gap: .4rem; } .est-legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; } .est-legend b { margin-left: auto; }
.est-total { margin: .6rem 0 0; font-weight: 700; display: flex; gap: .4rem; align-items: center; }

/* notices */
.notice { display: flex; gap: .6rem; align-items: center; padding: .7rem .9rem; border-radius: var(--r-sm); border: 1px solid; font-size: .92rem; text-decoration: none; color: var(--ink); margin: .5rem 0; }
.notice.info { background: #EEF4FF; border-color: #BFD3FB; } .notice.warn { background: #FFF7E6; border-color: #F1D49B; } .notice.err { background: #FDEDEC; border-color: #F2B8B1; }
a.notice:hover { filter: brightness(.98); } .notice .ic:last-child { margin-left: auto; }
.code { font-size: 1.25rem; letter-spacing: .2em; font-family: ui-monospace, monospace; }

/* ---------- patient pages ---------- */
.appt { display: flex; gap: 1.2rem; }
.appt-when { flex: none; width: 92px; text-align: center; background: var(--brand-soft); border-radius: 12px; padding: .7rem .4rem; align-self: flex-start; }
.appt-when .day { display: block; font-size: .8rem; font-weight: 700; color: var(--brand); text-transform: capitalize; }
.appt-when .time { display: block; font-family: var(--display); font-weight: 800; font-size: 1.15rem; }
.appt-main { flex: 1; min-width: 0; } .appt-main .actions { margin-top: .8rem; }
.live { margin-top: .8rem; } .live h4 { display: flex; gap: .4rem; align-items: center; }
@media (max-width: 600px) { .appt { flex-direction: column; gap: .6rem; } .appt-when { width: auto; display: flex; gap: .6rem; align-items: baseline; justify-content: center; } }
.crowd-prompt { margin-top: .8rem; padding: .7rem .9rem; border: 1px dashed var(--line); border-radius: var(--r-sm); background: #FBFDFD; }
.crowd-btn.c1 { color: var(--quiet); } .crowd-btn.c2 { color: var(--moderate); } .crowd-btn.c3 { color: var(--busy); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .8rem; }
.tile { display: flex; flex-direction: column; gap: .2rem; padding: 1rem; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); text-decoration: none; color: var(--ink); box-shadow: var(--shadow); }
.tile .ic { width: 28px; height: 28px; color: var(--c); margin-bottom: .3rem; } .tile span { color: var(--muted); font-size: .88rem; }
.tile:hover { border-color: var(--c); }

/* ---------- modal, toasts ---------- */

@keyframes pop { from { transform: scale(.97); opacity: 0; } } @keyframes slide { from { transform: translateX(30px); opacity: 0; } }
.switch-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .7rem 0; border-bottom: 1px solid var(--line); } .switch-row p { margin: 0; font-size: .88rem; }
.switch { flex: none; width: 52px; height: 30px; border-radius: 99px; border: 2px solid var(--muted); background: var(--line); position: relative; cursor: pointer; }
.switch span { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--brand); border-color: var(--brand); } .switch[aria-checked="true"] span { left: 24px; }
.a11y-group { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-bottom: .7rem; border-bottom: 1px solid var(--line); }
.a11y-group .seg-ctrl button { min-width: 48px; justify-content: center; font-family: var(--display); }
.notif-list { list-style: none; padding: 0; margin: 0; } .notif-list li { padding: .8rem 0; border-bottom: 1px solid var(--line); } .notif-list li.unread { border-left: 4px solid var(--blue); padding-left: .7rem; }
.notif-list p { margin: .2rem 0; } .notif-list time { font-size: .8rem; color: var(--muted); }
.toasts { position: fixed; top: calc(var(--top-h) + .6rem); right: 1rem; z-index: 80; display: grid; gap: .5rem; max-width: min(420px, calc(100vw - 2rem)); pointer-events: none; }
.toast { display: flex; gap: .6rem; align-items: center; padding: .8rem 1rem; border-radius: 12px; background: var(--ink); color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.2); animation: pop .2s ease; transition: opacity .35s, transform .35s; }
.toast-ok .ic { color: #6EE7B7; } .toast-err { background: #7F1D1D; } .toast-info .ic { color: #93C5FD; } .toast.out { opacity: 0; transform: translateY(-8px); }
body.voice-on::after { content: "🎙"; position: fixed; left: 1rem; bottom: 1rem; z-index: 90; background: var(--red); color: #fff; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; box-shadow: 0 0 0 6px rgba(192,57,43,.2); }
@media (max-width: 860px) { body.voice-on::after { bottom: calc(80px + env(safe-area-inset-bottom)); } }
@media (max-width: 480px) {
  .topbar { gap: .3rem; padding: 0 .5rem; } .brand { font-size: 1.1rem; gap: .4rem; } .top-actions { gap: 0; }
  .icon-btn { min-width: 40px; padding: 0 .3rem; } .user-btn .ic { display: none; } .user-btn { padding: 0 .2rem; }
}
@media (max-width: 600px) { .tracker li:not(.now) .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .tracker li.now .lbl { white-space: nowrap; } }
html.hc .count { background: #fff; border: 2px solid #000; color: #000; }
html.hc .tracker li::before { background: #000; }
.site-footer { border-top: 1px solid var(--line); background: var(--card); padding: 1rem clamp(1rem, 3vw, 2.5rem) 1.2rem; font-size: .85rem; color: var(--muted); }
.site-footer nav { display: flex; flex-wrap: wrap; gap: .3rem 1rem; margin-bottom: .4rem; }
.site-footer a, .site-footer .link { color: var(--ink-2); font-size: .85rem; }
.site-footer .sos { color: var(--red); font-weight: 700; }
@media (max-width: 860px) { .site-footer { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom)); } }
.legal-doc { max-width: 780px; } .legal-doc h2 { margin-top: 1.6rem; font-size: 1.1rem; } .legal-doc ul { padding-left: 1.2rem; } .legal-doc li { margin: .35rem 0; }
.legal-doc .updated { font-size: .85rem; color: var(--muted); } .legal-doc .lead { font-size: 1.05rem; }
.legal-tabs { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
.gate-wrap { position: fixed; inset: 0; z-index: 90; background: rgba(10,25,30,.6); display: grid; place-items: center; padding: 1rem; }
.gate { background: var(--card); border-radius: 18px; width: min(680px, 100%); max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.gate-head { padding: 1.2rem 1.4rem .4rem; } .gate-head h1 { font-size: 1.4rem; display: flex; gap: .5rem; align-items: center; }
.gate-body { padding: .4rem 1.4rem 1rem; overflow: auto; } .gate-body > * + * { margin-top: .7rem; }
.gate-body .key-points { padding-left: 1.2rem; } .gate-body .key-points li { margin: .3rem 0; }
.gate-body details { border: 1px solid var(--line); border-radius: var(--r-sm); padding: .5rem .8rem; }
.gate-body details .legal-doc { max-height: 40vh; overflow: auto; padding-right: .4rem; font-size: .92rem; }
.gate-foot { padding: .9rem 1.4rem 1.2rem; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: .6rem; justify-content: flex-end; }
.gate-foot .btn { flex: 1 1 180px; }
.cookie-cat { border: 1px solid var(--line); border-radius: var(--r-sm); padding: .7rem .9rem; display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
.cookie-cat p { margin: .2rem 0 0; font-size: .88rem; color: var(--muted); }
.consent-checks { display: grid; gap: .6rem; } .check-row { display: flex; gap: .6rem; align-items: flex-start; font-size: .93rem; }
.check-row input { width: 22px; height: 22px; min-height: 0; margin-top: .1rem; flex: none; accent-color: var(--brand); }
.danger-zone { border-color: #F2B8B1; } .danger-zone h2 { color: var(--red); }
@media print { .topbar, .sidenav, .tabbar, .fab { display: none; } }

/* staff booking: new vs returning patient */
.patient-mode { display: flex; width: 100%; }
.patient-mode button { flex: 1; justify-content: center; }
.patient-matches { max-height: 260px; overflow: auto; }
.patient-matches .choice { width: 100%; display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; }
@media (max-width: 600px) {
  .page-head h1 { font-size: clamp(1.45rem, 6.5vw, 1.9rem); }
  .toolbar { gap: .6rem; }
  .actions .btn { flex: 1 1 auto; justify-content: center; }
}

/* "joined the waitlist" corner notification – small, Windows-style, bottom right */
.desk-notices { position: fixed; right: 16px; bottom: 16px; z-index: 70; display: flex; flex-direction: column; gap: 10px; width: min(360px, calc(100vw - 32px)); pointer-events: none; }
.desk-notice { pointer-events: auto; display: flex; gap: .75rem; align-items: flex-start; background: var(--card); color: var(--ink); border: 1px solid var(--line);
  border-left: 4px solid var(--brand); border-radius: 10px; padding: .75rem .6rem .75rem .85rem; box-shadow: 0 8px 28px rgba(15, 35, 40, .18); animation: dn-in .25s ease-out; }
.desk-notice.out { opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; }
.dn-icon { flex: none; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.dn-icon .ic { width: 18px; height: 18px; }
.dn-text { flex: 1; min-width: 0; }
.dn-text p { margin: 0; }
.dn-app { font-size: .72rem; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
.dn-title { font-size: .92rem; margin-top: 1px !important; }
.dn-body { font-size: .8rem; color: var(--ink-2); margin-top: 2px !important; }
.dn-link { display: inline-block; margin-top: .35rem; font-size: .8rem; font-weight: 700; color: var(--brand); }
.dn-close { flex: none; border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; cursor: pointer; }
.dn-close:hover, .dn-close:focus-visible { background: var(--bg); color: var(--ink); }
.dn-close .ic { width: 16px; height: 16px; }
@keyframes dn-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@media (max-width: 860px) { .desk-notices { bottom: calc(72px + env(safe-area-inset-bottom)); right: 12px; width: calc(100vw - 24px); } }
@media (prefers-reduced-motion: reduce) { .desk-notice { animation: none; } .desk-notice.out { transition: none; } }

/* =====================================================================
   WAYFINDING THEME
   ClinicFlow guides people through a visit the way a hospital does: signs (dark plates with a
   yellow edge), coloured floor lines (route lines with stations) and "take a number" tickets.
   Everything below only changes the look; layout and behaviour stay the same.
   ===================================================================== */

/* corridor floor: a faint terrazzo speckle */
body { background-color: var(--bg);
  background-image: radial-gradient(rgba(74, 87, 176, .07) 1px, transparent 1.5px), radial-gradient(rgba(111, 163, 122, .09) 1.2px, transparent 1.7px);
  background-size: 23px 23px, 41px 41px; background-position: 0 0, 13px 19px; }
html.hc body { background-image: none; }
h1, h2, h3, h4 { font-family: var(--display); letter-spacing: -.005em; }
h1 { font-weight: 900; font-size: clamp(1.7rem, 3vw, 2.35rem); line-height: 1.08; letter-spacing: -.02em; }
h2 { font-weight: 800; font-size: 1.22rem; } h3 { font-weight: 800; font-size: 1.08rem; }
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 6px #BFE0C2; border-radius: 6px; }
input:focus, select:focus, textarea:focus { border-color: var(--brand); outline: 3px solid #A8C7F0; outline-offset: 0; box-shadow: none; }

/* ---------- top bar + brand ---------- */
.topbar { background: var(--card); border-bottom: 2px solid transparent; border-image: var(--route) 1; border-image-width: 0 0 2px 0; }
.brand { font-family: var(--display); font-weight: 900; font-size: 1.4rem; letter-spacing: -.02em; gap: .6rem; }
.brand b { color: inherit; font-weight: 900; }
.logo { background: var(--brand); border-radius: 6px; box-shadow: inset 0 0 0 2px var(--brand), inset 0 0 0 4px #fff; width: 36px; height: 36px; }
.logo.big { border-radius: 10px; box-shadow: inset 0 0 0 3px var(--brand), inset 0 0 0 6px #fff; }
.avatar { background: var(--signal); color: var(--ink); font-family: var(--display); font-weight: 900; }
.icon-btn { border-radius: 8px; }
.clinic-name { color: var(--ink); font-family: var(--display); font-weight: 800; }

/* ---------- side navigation = a route map with stations ---------- */
.sidenav { background: var(--card); border-right: 1px solid var(--line); padding: 1.4rem .8rem 1.4rem 0; }
.sidenav::before { content: ""; position: absolute; left: 25px; top: 2.1rem; bottom: 0; width: 6px; border-radius: 3px 3px 0 0; background: var(--route-v); }
.nav-link { position: relative; padding: .7rem .8rem .7rem 3.4rem; margin: 0 0 4px; border-radius: 0 8px 8px 0; color: var(--ink-2); font-family: var(--display); font-weight: 800; font-size: 1.02rem; }
.nav-link::before { content: ""; position: absolute; left: 19px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; background: var(--card); border: 4px solid #8FA2DB; box-sizing: border-box; transition: transform .2s; }
.nav-link .ic { width: 1.05em; height: 1.05em; color: var(--muted); }
.nav-link:hover { background: var(--bg); color: var(--ink); }
.nav-link:hover::before { transform: scale(1.15); }
.nav-link.active { background: var(--plate); color: #fff; }
.nav-link.active .ic { color: var(--signal); }
.nav-link.active::before { width: 26px; height: 26px; margin-top: -13px; left: 15px; background: var(--signal); border-color: var(--plate); box-shadow: 0 0 0 3px var(--signal); }
html.hc .sidenav::before { background: #000; }

/* phone tab bar */
@media (max-width: 860px) {
  .tabbar { background: var(--card); border-top: 2px solid transparent; border-image: var(--route) 1; border-image-width: 2px 0 0 0; }
  .tab { font-family: var(--display); font-weight: 800; border-radius: 8px; }
  .tab.active { background: var(--plate); color: #fff; }
  .tab.active .ic { color: var(--signal); }
}

/* ---------- page header = hanging wayfinding sign ---------- */
.page-head { position: relative; background: linear-gradient(115deg, var(--plate), #48568F 70%, #4B6488); color: #fff; border-radius: var(--r-sm); padding: 1.15rem 1.4rem 1.2rem; margin: 18px 0 1.6rem;
  border-bottom: 6px solid transparent; border-image: var(--route) 1; border-image-width: 0 0 6px 0; }
.page-head::before, .page-head::after { content: ""; position: absolute; top: -18px; width: 4px; height: 18px; background: #8C95B5; border-radius: 2px 2px 0 0; }
.page-head::before { left: 14%; } .page-head::after { right: 14%; }
.page-head h1 { color: #fff; margin: 0; }
.page-head p, .page-head .muted { color: rgba(255, 255, 255, .8); margin: .35rem 0 0; }
.page-head a:not(.btn) { color: #fff; }
.page-head .btn { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .7); box-shadow: 0 3px 0 rgba(255, 255, 255, .35); }
.page-head .btn:hover { background: rgba(255, 255, 255, .1); }
.page-head .btn.primary { background: var(--signal); color: var(--ink); border-color: var(--signal-deep); box-shadow: 0 3px 0 var(--signal-deep); }
.page-head .btn.primary:hover { background: #D2EAD4; }
.page-head .seg-ctrl { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .3); }
.page-head .seg-ctrl button { color: #fff; }
.page-head .seg-ctrl button[aria-checked="true"] { background: var(--signal); color: var(--ink); }
.page-head .count { background: var(--signal); color: var(--ink); }
/* the sign settles into place when you open a page (not on live refreshes) */
main.enter .page-head { animation: sign-settle .6s cubic-bezier(.2, .9, .25, 1.25); transform-origin: 50% -18px; }
@keyframes sign-settle { 0% { opacity: 0; transform: perspective(700px) rotateX(-24deg) translateY(-8px); } 60% { opacity: 1; transform: perspective(700px) rotateX(5deg); } 100% { transform: none; } }

/* ---------- surfaces ---------- */
.card { border-radius: var(--r); border: 1px solid var(--line); box-shadow: var(--shadow); }
.section-title { font-size: 1.2rem; font-weight: 900; margin: 1.8rem 0 .8rem; }
.count { background: var(--ink); color: #fff; font-family: var(--display); font-weight: 800; border-radius: 5px; padding: .05rem .45rem; }
hr { border-top: 2px dashed var(--line); }
.badge { font-family: var(--display); font-weight: 900; }

/* ---------- buttons you can press ---------- */
.btn { border-radius: 8px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); font-family: var(--display); font-weight: 800; letter-spacing: .005em;
  box-shadow: 0 3px 0 var(--ink); transition: transform .08s ease, box-shadow .08s ease, background-color .15s; margin-bottom: 3px; }
.btn:hover { border-color: var(--ink); background: #F4F6FC; }
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--brand); border-color: var(--brand-deep); color: #fff; box-shadow: 0 3px 0 var(--brand-deep); }
.btn.primary:hover { background: #5563BE; }
.btn.danger { background: var(--red); border-color: #7E1C15; box-shadow: 0 3px 0 #7E1C15; }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; margin-bottom: 0; }
.btn.ghost:hover { background: rgba(20, 26, 61, .07); }
.btn.ghost:active { transform: translateY(1px); }
.btn.sm { box-shadow: 0 2px 0 var(--ink); border-radius: 7px; } .btn.sm.primary { box-shadow: 0 2px 0 var(--brand-deep); }
.btn.sm:active { transform: translateY(2px); }
.btn.ghost.sm { box-shadow: none; }
.btn:disabled, .btn:disabled:active { transform: none; box-shadow: none; opacity: .45; }
.link { color: var(--brand); }
html.hc .btn { box-shadow: none !important; }

/* chips are small sign tags */
.chip { border-radius: 5px; font-family: var(--display); font-weight: 800; }
.crowd { border-radius: 5px; font-family: var(--display); font-weight: 800; }

/* ---------- visit tracker = a route line with stations ---------- */
.tracker li { font-size: .8rem; color: var(--muted); }
.tracker li::before { top: 11px; height: 6px; border-radius: 3px; background: var(--line); }
.tracker li.done::before, .tracker li.now::before { background: linear-gradient(90deg, #8EA3E0, var(--brand)); }
.tracker .node { width: 28px; height: 28px; border: 4px solid var(--line); background: var(--card); color: transparent; font-size: 0; }
.tracker li.done .node { background: var(--brand); border-color: var(--brand); color: #fff; font-size: .75rem; }
.tracker li.now .node { background: var(--signal); border-color: var(--ink); box-shadow: 0 0 0 4px var(--signal-soft); animation: here 1.6s ease-out 3; }
.tracker li.now { color: var(--ink); font-family: var(--display); font-weight: 900; }
@keyframes here { 0% { box-shadow: 0 0 0 0 rgba(111, 163, 122, .8); } 100% { box-shadow: 0 0 0 12px rgba(111, 163, 122, 0); } }
html.hc .tracker .node { color: #000; font-size: .75rem; }

/* ---------- appointment = a "take a number" ticket ---------- */
.card.appt { padding: 0; gap: 0; overflow: hidden; position: relative; }
.appt-when { position: relative; align-self: stretch; width: 124px; border-radius: 0; padding: 1.25rem .7rem; background: var(--signal); color: var(--ink);
  display: flex; flex-direction: column; justify-content: flex-start; border-right: 2px dashed rgba(45, 52, 86, .35); }
.appt-when::before, .appt-when::after { content: ""; position: absolute; right: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.appt-when::before { top: -11px; } .appt-when::after { bottom: -11px; }
.appt-when .day { color: var(--ink); font-family: var(--display); font-weight: 800; font-size: .85rem; line-height: 1.15; }
.appt-when .time { font-family: var(--display); font-weight: 900; font-size: 1.85rem; line-height: 1; margin-top: .35rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.appt-main { padding: 1.15rem 1.35rem 1.3rem; }
.appt-main h3 { font-size: 1.25rem; font-weight: 900; }
@media (max-width: 600px) {
  .card.appt { flex-direction: column; }
  .appt-when { width: auto; flex-direction: row; align-items: baseline; gap: .7rem; justify-content: center; border-right: 0; border-bottom: 2px dashed rgba(45, 52, 86, .35); padding: .9rem; }
  .appt-when::before, .appt-when::after { right: auto; top: auto; bottom: -11px; }
  .appt-when::before { left: -11px; } .appt-when::after { right: -11px; }
  .appt-when .time { margin: 0; font-size: 1.6rem; }
}
html.hc .appt-when { background: #fff; border-right: 2px dashed #000; }

/* home shortcuts look like a building directory */
.tile { border-radius: var(--r); box-shadow: var(--shadow); flex-direction: row; flex-wrap: wrap; align-items: center; column-gap: .8rem; transition: transform .15s, border-color .15s; }
.tile .ic { width: 40px; height: 40px; padding: 8px; border-radius: 7px; background: var(--c, var(--brand)); color: #fff; margin: 0; }
.tile b, .tile strong { font-family: var(--display); font-weight: 900; font-size: 1.05rem; }
.tile span { flex-basis: 100%; }
.tile:hover { border-color: var(--ink); transform: translateX(3px); }
.tile:active { transform: translateX(3px) scale(.98); }

/* notices */
.notice { border-radius: var(--r-sm); border-width: 1px 1px 1px 6px; }
.notice.info { background: #EEF1FA; border-color: #C3CCEA; border-left-color: var(--brand); }
.notice.warn { background: #FFF6DE; border-color: #EBD394; border-left-color: #B88A1E; }
.notice.err { background: #FDEDEC; border-color: #F2B8B1; border-left-color: var(--red); }
.estimate { background: #F2F4FA; border-radius: var(--r-sm); }
.est-bar { border-radius: 3px; height: 12px; }

/* ---------- booking wizard: the route to your visit ---------- */
.progress { height: 10px; background: var(--line); border-radius: 5px; margin: 2rem 0 1.4rem; }
.progress-fill { position: relative; background: linear-gradient(90deg, #8EA3E0, var(--brand)); border-radius: 5px; transition: width .6s cubic-bezier(.3, .9, .3, 1); }
.progress-fill::after { content: ""; position: absolute; right: -12px; top: 50%; width: 24px; height: 24px; margin-top: -12px; border-radius: 50%; background: var(--signal); border: 4px solid var(--ink); box-sizing: border-box; }
.progress.done .progress-fill { background: var(--route); }
.progress-label { top: -2rem; color: var(--ink); font-family: var(--display); font-weight: 900; }
.wiz-steps li { border: 0; background: transparent; font-family: var(--display); font-weight: 800; padding-left: 0; }
.wiz-steps li span, .wiz-steps li .ic { width: 22px; height: 22px; background: var(--card); border: 3px solid var(--line); font-size: .7rem; }
.wiz-steps li.done { color: var(--brand); } .wiz-steps li.done .ic { background: var(--brand); border-color: var(--brand); }
.wiz-steps li.now { color: var(--ink); } .wiz-steps li.now span { background: var(--signal); color: var(--ink); border-color: var(--ink); }
.choice { position: relative; border-radius: var(--r); border: 2px solid var(--line); transition: transform .12s, border-color .15s, background-color .15s; }
.choice:hover { border-color: var(--ink); }
.choice:active { transform: scale(.98); }
.choice.selected { border-color: var(--brand); background: var(--brand-soft); animation: stamp .3s ease-out; }
.choice.selected::after { content: "✓"; position: absolute; top: .55rem; right: .6rem; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--brand); color: #fff; font-weight: 900; font-size: .9rem; }
.choice b, .choice strong, .choice h3 { font-family: var(--display); font-weight: 900; }
.choice.add { color: var(--brand); border-color: var(--brand); }
@keyframes stamp { 0% { transform: scale(.94); } 60% { transform: scale(1.02); } 100% { transform: none; } }
.pill span, a.pill, button.pill { border-radius: 7px; border-width: 2px; font-family: var(--display); font-weight: 800; }
.pill span, a.pill, button.pill { border-style: dashed; color: var(--muted); background: transparent; }
.pill input:checked + span, a.pill.on, button.pill.on { background: var(--card); border-style: solid; border-color: var(--ink); color: var(--ink); }
.pill input:checked + span::before { color: var(--brand); font-weight: 900; }
.date-btn { border-radius: 8px; transition: transform .12s, border-color .15s; }
.date-btn b { font-family: var(--display); font-weight: 900; font-variant-numeric: tabular-nums; }
.date-btn:not(.avail-none):hover { border-color: var(--ink); }
.date-btn:active { transform: scale(.96); }
.date-btn[aria-checked="true"] { background: var(--plate); border-color: var(--plate); box-shadow: inset 0 -5px 0 var(--signal); }
.slot { border-radius: 7px; font-family: var(--display); font-weight: 900; font-variant-numeric: tabular-nums; transition: transform .1s, background-color .15s, border-color .15s; }
.slot:hover { border-color: var(--ink); background: var(--card); }
.slot:active { transform: scale(.95); }
.slot.selected { background: var(--brand); border-color: var(--brand-deep); color: #fff; animation: stamp .3s ease-out; }
.slot.selected small { color: rgba(255, 255, 255, .85); }
.radio-card { border-radius: 8px; } .radio-card:has(input:checked) { border-color: var(--ink); background: var(--signal-soft); color: var(--ink); }
.seg-ctrl { border-radius: 9px; border: 2px solid var(--line); background: var(--card); }
.seg-ctrl button { font-family: var(--display); font-weight: 800; border-radius: 6px; }
.seg-ctrl button[aria-checked="true"] { background: var(--ink); color: #fff; box-shadow: none; }
.switch[aria-checked="true"] { background: var(--brand); border-color: var(--brand); }

/* booking confirmed: the ticket prints */
.success-card { position: relative; overflow: visible; border-top: 6px solid var(--signal); animation: ticket-print .75s cubic-bezier(.2, .8, .2, 1); }
.success-card::before, .success-card::after { content: ""; position: absolute; top: 46%; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.success-card::before { left: -12px; } .success-card::after { right: -12px; }
.big-check { background: var(--brand); box-shadow: 0 0 0 6px var(--brand-soft); animation: stamp-in .45s .55s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes ticket-print { from { clip-path: inset(0 0 100% 0); transform: translateY(-14px); } to { clip-path: inset(0 0 -40px 0); transform: none; } }
@keyframes stamp-in { from { transform: scale(2.2) rotate(-14deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* forms */
input, select, textarea { border: 2px solid #C5CCE0; border-radius: 7px; }
.field label, .label, legend { font-family: var(--display); font-weight: 800; }

/* ---------- sign-in page: the clinic's entrance sign ---------- */
.auth-card { border-radius: var(--r); border-top: 6px solid var(--brand); }
.auth-side { position: relative; overflow: hidden; border-radius: 10px; background: linear-gradient(150deg, var(--plate), #4A5B96 60%, #4C6E88); border-bottom: 10px solid transparent; border-image: var(--route) 1; border-image-width: 0 0 10px 0; }
.auth-side h2 { font-family: var(--display); font-weight: 900; font-size: clamp(1.9rem, 3vw, 2.6rem); line-height: 1.05; letter-spacing: -.02em; max-width: 14ch; }
.auth-side ul { position: relative; gap: 1.15rem; margin-top: 1.6rem; }
.auth-side ul::before { content: ""; position: absolute; left: 13px; top: 8px; bottom: 8px; width: 6px; border-radius: 3px; background: var(--route-v); }
.auth-side li { position: relative; padding-left: 0; z-index: 1; }
.auth-side li .ic { width: 32px; height: 32px; padding: 6px; border-radius: 50%; background: var(--plate); border: 3px solid var(--signal); color: #fff; flex: none; }
.auth-side .logo { background: var(--brand); }
.demo-accounts { border: 2px dashed var(--line); background: var(--card); }

/* ---------- staff ---------- */
.kpi { border-radius: var(--r); box-shadow: var(--shadow); border-top: 1px solid var(--line); border-left: 6px solid var(--c); }
.kpi b { font-size: 2.2rem; font-weight: 900; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { font-family: var(--display); font-weight: 800; }
.q-col { background: var(--card); border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: var(--r); }
.q-col h2 { font-weight: 900; }
.q-card { border-radius: 7px; border-left-width: 6px; transition: transform .12s; }
.q-card:hover { transform: translateX(2px); }
.q-time { font-family: var(--display); font-weight: 900; color: var(--ink); }
.cal { border-radius: var(--r); border: 1px solid var(--line); }
.cal-col.is-today { background: #F0F3FC; }
.cal-head { font-family: var(--display); font-weight: 800; }
.cal-col.is-today .daynum { background: var(--plate); color: var(--signal); border-radius: 5px; }
.appt-block { border-radius: 5px; transition: transform .12s, box-shadow .12s; }
.appt-block b { font-family: var(--display); font-weight: 900; }
.appt-block:hover { transform: translateX(2px); }
.now-line { height: 3px; }
.table th { text-transform: none; letter-spacing: 0; font-family: var(--display); font-weight: 900; font-size: .85rem; color: var(--ink); border-bottom: 2px solid #B9C3DE; }
.table tbody tr { transition: background-color .12s; } .table tbody tr:hover { background: #F4F6FC; }
.tabs { border-bottom: 2px solid var(--line); }
.tabs a { font-family: var(--display); font-weight: 800; border-radius: 6px 6px 0 0; }
.tabs a.active { background: var(--plate); color: #fff; border-color: var(--signal); }
.thread.active { background: var(--signal-soft); }
.bubble { border-radius: 10px 10px 10px 3px; } .bubble.me { border-radius: 10px 10px 3px 10px; }

/* ---------- modals, side panel, consent: the sign plate again ---------- */
.modal { border-radius: 10px; overflow: hidden; }
.modal-wrap.side .modal { border-radius: 10px 0 0 10px; }
.modal-head { background: linear-gradient(115deg, var(--plate), #48568F); color: #fff; border-bottom: 6px solid transparent; border-image: var(--route) 1; border-image-width: 0 0 6px 0; padding: 1rem 1.2rem; }
.modal-head h2 { color: #fff; }
.modal-head .icon-btn, .modal-head .btn.ghost { color: #fff; }
.modal-head .icon-btn:hover { background: rgba(255, 255, 255, .12); color: #fff; }
.modal-backdrop, .gate-wrap { background: rgba(45, 52, 86, .45); }
.gate { border-radius: 10px; overflow: hidden; }
.gate-head { background: linear-gradient(115deg, var(--plate), #48568F); color: #fff; border-bottom: 6px solid transparent; border-image: var(--route) 1; border-image-width: 0 0 6px 0; padding: 1.2rem 1.4rem 1rem; }
.gate-head h1, .gate-head p { color: #fff; }
@keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } }

/* toasts and corner notifications */
.toast { background: var(--plate); border-radius: 7px; border-left: 6px solid var(--signal); }
.toast-err { background: #7A2A2A; border-left-color: #FF8A80; }
.desk-notice { border-radius: 8px; border-left-color: var(--signal); }
.dn-icon { background: var(--plate); color: var(--signal); border-radius: 6px; }
.dn-title { font-family: var(--display); }

.site-footer { background: var(--card); border-top: 1px solid var(--line); }
.empty .ic { color: var(--brand); }
.clinic img, .clinic .ph, .row-choice .ph { background: var(--brand-soft); color: var(--brand); }
.hours tr.today { color: var(--ink); background: var(--signal-soft); }
.gate-head .muted { color: rgba(255, 255, 255, .82); margin-bottom: .5rem; }
.gate-head .btn, .modal-head .btn { color: #fff; }
.gate-head .btn:hover, .modal-head .btn:hover { background: rgba(255, 255, 255, .12); }
.gate-head h1 .ic, .modal-head h2 .ic { color: var(--signal); }
/* finished visits: greyed, not faded, so the name stays readable */
.appt-block.st-completed, .appt-block.st-no_show { opacity: 1; filter: grayscale(.85); }
.appt-block.st-completed b, .appt-block.st-no_show b { color: var(--ink-2); }

      sections: [
        ["1. Who is responsible", ["ClinicFlow is operated by Call 4 Action, a student design team at the University of Ottawa (GNG 1103). We are accountable for the personal information in your ClinicFlow account under Canada's Personal Information Protection and Electronic Documents Act (PIPEDA) and, where it applies, Quebec's Act respecting the protection of personal information in the private sector (Law 25). Our Privacy Officer can be reached at {email}."]],
        ["2. Clinics and your health information", ["When you book with a clinic, information about that appointment (for example, that you are a patient of the clinic, the date, the practitioner and the visit type) may be personal health information. The clinic is the health information custodian of this information under Ontario's Personal Health Information Protection Act, 2004 (PHIPA) or a similar law. For this information, ClinicFlow acts only as an electronic service provider on the clinic's behalf: we use it only to provide the Service to the clinic and to you, we do not disclose it except as described here or as required by law, and everyone on our team who can access it has agreed to keep it confidential. Questions about how a clinic handles your health information should also be sent to that clinic."]],
        ["3. What we collect", [
          "• Account information: first and last name, email address, optional phone number, preferred language, notification choice, two-step verification setting.",
          "• Security information: your password and optional shared account password are stored only as one-way encrypted hashes (scrypt), never in readable form. Verification codes are kept in temporary memory for 10 minutes and are never written to the database.",
          "• Family members you add: first name, last name and relationship.",
          "• Bookings: clinic, practitioner, date and time, visit type, an optional short note (max 140 characters, no medical details), status and check-in/consultation times, and waitlist requests.",
          "• Pre-visit forms: only the administrative answers the clinic asks for (for example preferred language or accessibility needs).",
          "• Messages you exchange with a clinic, saved clinics and in-app notifications.",
          "• Visit reminders: the type, generic label, dates and times your practitioner sets for your reminders. The calendar contains no medication names, doses or clinical instructions.",
          "• “How busy is it?” answers: saved anonymously, without your name or account.",
          "• Technical information: a sign-in session token, and for clinic staff, a record of which appointment records they opened or changed (access log)."]],
        ["4. What we do NOT collect", ["We do not ask for or store diagnoses, symptoms, prescriptions, test results, treatment plans, health card numbers, social insurance numbers, payment card details, your precise location, or advertising identifiers. We do not use analytics, advertising or tracking cookies, and we do not build profiles about you."]],
        ["5. Why we use it", [
          "• To create and secure your account and confirm your identity (verification codes, two-step verification).",
          "• To let you find clinics and book, change, cancel or follow appointments, for you or family members you are authorized to act for.",
          "• To share the booking with the clinic you choose and let it manage its schedule and patient flow.",
          "• To send the transactional messages you need (confirmations, reminders, changes, waitlist offers, replies).",
          "• To produce wait-time estimates (using the clinic's live queue and anonymous reports).",
          "• To protect the Service, prevent misuse and investigate security incidents.",
          "• To meet legal obligations.",
          "We do not use your information for any other purpose without asking you first. We never sell, rent or trade personal information, and we never use it for advertising."]],
        ["6. Your consent", ["We ask for your express consent when you create an account, in clear terms and separately from other information. You may withdraw consent at any time by deleting your account (Account → Privacy & data) or by writing to {email}. If you withdraw consent, we will no longer be able to provide the Service to you, but clinics may keep the appointment records they are required by law to keep."]],
        ["7. Who can see your information", [
          "• The clinic you book with, and only the clinic staff whose role requires it (reception, nurses, clinic administrators). Every opening or change of an appointment record by staff is logged.",
          "• Your reminder calendar is available to your account and editable by the practitioner assigned to the completed visit.",
          "• Our service providers, only to run the Service and under their own security and confidentiality commitments: Google Cloud / Firebase (Cloud Firestore database, stored in the Montréal, Canada region), Google (Gmail, to send emails) and Render (web hosting, United States).",
          "• Authorities, only when required by law (for example a court order) or to prevent imminent harm.",
          "No one else. No data brokers, advertisers or social networks."]],
        ["8. Information processed outside your province or Canada", ["Our database is stored in Canada (Montréal). Some providers (email delivery and web hosting) may process information in the United States or other countries, where it may be accessed by authorities under local laws. We chose large providers with recognized security safeguards and limit what they receive to what is needed."]],
        ["9. How long we keep it", [
          "• Account and family information: until you delete your account. Accounts unused for 24 months may be deleted after an email notice.",
          "• Reminder schedules: until removed by the practitioner or deleted with your account.",
          "• Appointments: while your account exists. When you delete your account, future appointments are cancelled and past ones are de-identified (name, email, phone and notes removed), except for records a clinic must keep by law.",
          "• Email delivery log: 90 days. In-app notifications: 180 days. Anonymous “how busy” reports: 30 days. Sign-in sessions: 30 days. Verification codes: 10 minutes. Staff access logs: 1 year.",
          "When information is no longer needed, it is securely deleted or anonymized."]],
        ["10. How we protect it", [
          "• Encryption in transit (HTTPS) and at rest (Google Cloud).",
          "• Passwords stored as salted scrypt hashes; emailed 6-digit codes with expiry and limited attempts; optional two-step verification; limits on repeated sign-in attempts.",
          "• Role-based access: patients see only their own information; staff see only their clinic; administrator settings are limited to administrators.",
          "• Staff must accept a confidentiality agreement; their access to appointment records is logged and can be reviewed by the clinic.",
          "• Security headers, minimal data collection and no third-party tracking.",
          "No system is perfectly secure, but we work to protect your information and to improve our safeguards."]],
        ["11. If there is a privacy breach", ["If a breach of security safeguards involving your personal information creates a real risk of significant harm, we will notify you and the affected clinic as soon as feasible, and report it to the Office of the Privacy Commissioner of Canada and, where required, to the Information and Privacy Commissioner of Ontario or the Commission d'accès à l'information du Québec. We keep a record of all privacy incidents."]],
        ["12. Your rights", [
          "• Access and portability: download a copy of your information at any time (Account → Privacy & data → Download my data).",
          "• Correction: edit your profile at any time, or ask us to correct information.",
          "• Deletion and withdrawal of consent: delete your account at any time (Account → Privacy & data → Delete my account).",
          "• Information: ask us what we hold about you, how it is used and to whom it was disclosed.",
          "• Complaint: contact our Privacy Officer at {email}. We answer within 30 days. You may also complain to the Office of the Privacy Commissioner of Canada (priv.gc.ca), the Information and Privacy Commissioner of Ontario (ipc.on.ca) or the Commission d'accès à l'information du Québec (cai.gouv.qc.ca)."]],
        ["13. Children", ["You must be of the age of majority to create an account. Information about a minor may only be entered by a parent, guardian or authorized representative using the family feature."]],
        ["14. Automated estimates", ["Wait-time and “how busy” estimates are calculated automatically from the clinic's live queue, past visit durations and anonymous reports. They are for convenience only and are never used to make decisions about you or your access to care."]],
        ["15. Cookies and similar technologies", ["See our Cookie Policy. In short: we use only what is needed to keep you signed in and remember your choices, plus optional preferences you can turn off."]],
        ["16. Changes", ["We will post any changes here with a new date and ask you to accept important changes."]],
      ] },
    fr: { title: "Politique de confidentialité", intro: "Votre vie privée nous tient à cœur. La présente politique explique, en langage clair, quels renseignements personnels ClinicFlow recueille, pourquoi, qui peut les voir, combien de temps nous les conservons, comment nous les protégeons et quels sont vos droits.",
      sections: [
        ["1. Qui est responsable", ["ClinicFlow est exploité par Call 4 Action, une équipe étudiante de conception de l'Université d'Ottawa (GNG 1103). Nous sommes responsables des renseignements personnels de votre compte ClinicFlow en vertu de la Loi sur la protection des renseignements personnels et les documents électroniques (LPRPDE) du Canada et, lorsqu'elle s'applique, de la Loi sur la protection des renseignements personnels dans le secteur privé du Québec (Loi 25). Vous pouvez joindre notre responsable de la protection des renseignements personnels à {email}."]],
        ["2. Les cliniques et vos renseignements sur la santé", ["Lorsque vous réservez auprès d'une clinique, les renseignements sur ce rendez-vous (par exemple le fait que vous êtes patient de la clinique, la date, le praticien et le type de visite) peuvent constituer des renseignements personnels sur la santé. La clinique est le dépositaire de ces renseignements au sens de la Loi de 2004 sur la protection des renseignements personnels sur la santé de l'Ontario (LPRPS) ou d'une loi semblable. Pour ces renseignements, ClinicFlow agit uniquement comme fournisseur de services électroniques pour le compte de la clinique : nous les utilisons seulement pour fournir le Service à la clinique et à vous, nous ne les communiquons pas sauf de la façon décrite ici ou si la loi l'exige, et toutes les personnes de notre équipe qui y ont accès se sont engagées à en préserver la confidentialité. Les questions sur la façon dont une clinique traite vos renseignements sur la santé devraient aussi être adressées à cette clinique."]],
        ["3. Ce que nous recueillons", [
          "• Renseignements du compte : prénom et nom, adresse courriel, numéro de téléphone facultatif, langue préférée, choix d'avis, paramètre de vérification en deux étapes.",
          "• Renseignements de sécurité : votre mot de passe et votre mot de passe de compte partagé facultatif sont conservés uniquement sous forme de hachages chiffrés à sens unique (scrypt), jamais sous forme lisible. Les codes de vérification sont gardés en mémoire temporaire pendant 10 minutes et ne sont jamais inscrits dans la base de données.",
          "• Membres de la famille que vous ajoutez : prénom, nom et lien.",
          "• Réservations : clinique, praticien, date et heure, type de visite, courte note facultative (140 caractères au maximum, sans détails médicaux), statut et heures d'arrivée et de consultation, ainsi que les demandes de liste d'attente.",
          "• Formulaires de préenregistrement : seulement les réponses administratives demandées par la clinique (par exemple la langue préférée ou les besoins d'accessibilité).",
          "• Les messages échangés avec une clinique, les cliniques enregistrées et les avis dans l'application.",
          "• Rappels de visite : le type, le libellé générique, les dates et les heures établis par votre praticien. Le calendrier ne contient aucun nom de médicament, aucune dose et aucune consigne clinique.",
          "• Réponses « Est-ce achalandé? » : enregistrées de façon anonyme, sans votre nom ni votre compte.",
          "• Renseignements techniques : un jeton de session de connexion et, pour le personnel des cliniques, un registre des dossiers de rendez-vous consultés ou modifiés (journal des accès)."]],
        ["4. Ce que nous NE recueillons PAS", ["Nous ne demandons ni ne conservons de diagnostics, symptômes, ordonnances, résultats d'examens, plans de traitement, numéros de carte santé, numéros d'assurance sociale, données de carte de paiement, votre position précise ou identifiants publicitaires. Nous n'utilisons aucun témoin d'analyse, de publicité ou de suivi et ne créons aucun profil à votre sujet."]],
        ["5. Pourquoi nous les utilisons", [
          "• Créer et sécuriser votre compte et confirmer votre identité (codes de vérification, vérification en deux étapes).",
          "• Vous permettre de trouver des cliniques et de réserver, modifier, annuler ou suivre des rendez-vous, pour vous ou pour les membres de votre famille pour lesquels vous êtes autorisé à agir.",
          "• Communiquer la réservation à la clinique que vous choisissez et lui permettre de gérer son horaire et le cheminement des patients.",
          "• Envoyer les messages transactionnels dont vous avez besoin (confirmations, rappels, modifications, offres de la liste d'attente, réponses).",
          "• Produire des estimations de temps d'attente (à partir de la file d'attente en direct de la clinique et de signalements anonymes).",
          "• Protéger le Service, prévenir les abus et enquêter sur les incidents de sécurité.",
          "• Respecter nos obligations légales.",
          "Nous n'utilisons pas vos renseignements à d'autres fins sans d'abord vous le demander. Nous ne vendons, ne louons ni n'échangeons jamais de renseignements personnels, et nous ne les utilisons jamais à des fins publicitaires."]],
        ["6. Votre consentement", ["Nous demandons votre consentement exprès lors de la création de votre compte, en termes clairs et distinctement de toute autre information. Vous pouvez retirer votre consentement en tout temps en supprimant votre compte (Compte → Confidentialité et données) ou en écrivant à {email}. Si vous retirez votre consentement, nous ne pourrons plus vous offrir le Service, mais les cliniques peuvent conserver les dossiers de rendez-vous que la loi les oblige à conserver."]],
        ["7. Qui peut voir vos renseignements", [
          "• La clinique auprès de laquelle vous réservez, et seulement les membres de son personnel dont le rôle l'exige (réception, infirmières, administrateurs de la clinique). Chaque consultation ou modification d'un dossier de rendez-vous par le personnel est consignée.",
          "• Nos fournisseurs de services, uniquement pour faire fonctionner le Service et selon leurs propres engagements de sécurité et de confidentialité : Google Cloud / Firebase (base de données Cloud Firestore, hébergée dans la région de Montréal, Canada), Google (Gmail, pour l'envoi des courriels) et Render (hébergement Web, États-Unis).",
          "• Les autorités, seulement lorsque la loi l'exige (par exemple une ordonnance d'un tribunal) ou pour prévenir un préjudice imminent.",
          "Personne d'autre. Aucun courtier en données, annonceur ni réseau social."]],
        ["8. Renseignements traités à l'extérieur de votre province ou du Canada", ["Notre base de données est hébergée au Canada (Montréal). Certains fournisseurs (envoi de courriels et hébergement Web) peuvent traiter des renseignements aux États-Unis ou dans d'autres pays, où ils peuvent être consultés par les autorités en vertu des lois locales. Nous avons choisi de grands fournisseurs dotés de mesures de sécurité reconnues et limitons ce qu'ils reçoivent au strict nécessaire."]],
        ["9. Durée de conservation", [
          "• Renseignements du compte et de la famille : jusqu'à la suppression de votre compte. Les comptes inutilisés pendant 24 mois peuvent être supprimés après un avis par courriel.",
          "• Calendrier des rappels : jusqu'au retrait par le praticien ou à la suppression de votre compte.",
          "• Rendez-vous : tant que votre compte existe. Lorsque vous supprimez votre compte, les rendez-vous à venir sont annulés et les rendez-vous passés sont dépersonnalisés (nom, courriel, téléphone et notes retirés), sauf les dossiers qu'une clinique doit conserver en vertu de la loi.",
          "• Registre d'envoi des courriels : 90 jours. Avis dans l'application : 180 jours. Signalements anonymes d'achalandage : 30 jours. Sessions de connexion : 30 jours. Codes de vérification : 10 minutes. Journaux d'accès du personnel : 1 an.",
          "Lorsque des renseignements ne sont plus nécessaires, ils sont supprimés de façon sécuritaire ou anonymisés."]],
        ["10. Comment nous les protégeons", [
          "• Chiffrement en transit (HTTPS) et au repos (Google Cloud).",
          "• Mots de passe conservés sous forme de hachages scrypt salés; codes à 6 chiffres envoyés par courriel, avec expiration et nombre d'essais limité; vérification en deux étapes facultative; limites aux tentatives de connexion répétées.",
          "• Accès selon le rôle : les patients voient seulement leurs propres renseignements; le personnel voit seulement sa clinique; les paramètres d'administration sont réservés aux administrateurs.",
          "• Le personnel doit accepter une entente de confidentialité; ses accès aux dossiers de rendez-vous sont consignés et peuvent être vérifiés par la clinique.",
          "• En-têtes de sécurité, collecte minimale de données et aucun suivi par des tiers.",
          "Aucun système n'est parfaitement sécuritaire, mais nous travaillons à protéger vos renseignements et à améliorer nos mesures de sécurité."]],
        ["11. En cas d'atteinte à la vie privée", ["Si une atteinte aux mesures de sécurité concernant vos renseignements personnels présente un risque réel de préjudice grave, nous vous en aviserons, ainsi que la clinique concernée, dès que possible, et nous la déclarerons au Commissariat à la protection de la vie privée du Canada et, s'il y a lieu, au Commissaire à l'information et à la protection de la vie privée de l'Ontario ou à la Commission d'accès à l'information du Québec. Nous tenons un registre de tous les incidents de confidentialité."]],
        ["12. Vos droits", [
          "• Accès et portabilité : téléchargez une copie de vos renseignements en tout temps (Compte → Confidentialité et données → Télécharger mes données).",
          "• Rectification : modifiez votre profil en tout temps ou demandez-nous de corriger des renseignements.",
          "• Suppression et retrait du consentement : supprimez votre compte en tout temps (Compte → Confidentialité et données → Supprimer mon compte).",
          "• Information : demandez-nous quels renseignements nous détenons à votre sujet, comment ils sont utilisés et à qui ils ont été communiqués.",
          "• Plainte : écrivez à notre responsable de la protection des renseignements personnels à {email}. Nous répondons dans un délai de 30 jours. Vous pouvez aussi porter plainte auprès du Commissariat à la protection de la vie privée du Canada (priv.gc.ca), du Commissaire à l'information et à la protection de la vie privée de l'Ontario (ipc.on.ca) ou de la Commission d'accès à l'information du Québec (cai.gouv.qc.ca)."]],
        ["13. Enfants", ["Vous devez avoir atteint l'âge de la majorité pour créer un compte. Les renseignements concernant une personne mineure ne peuvent être inscrits que par un parent, un tuteur ou un représentant autorisé, au moyen de la fonction famille."]],
        ["14. Estimations automatisées", ["Les estimations de temps d'attente et d'achalandage sont calculées automatiquement à partir de la file d'attente en direct de la clinique, de la durée des visites passées et de signalements anonymes. Elles sont fournies à titre indicatif seulement et ne servent jamais à prendre des décisions à votre sujet ou concernant votre accès aux soins."]],
        ["15. Témoins et technologies semblables", ["Consultez notre Politique relative aux témoins. En bref : nous utilisons seulement ce qui est nécessaire pour vous garder connecté et retenir vos choix, ainsi que des préférences facultatives que vous pouvez désactiver."]],
        ["16. Modifications", ["Nous publierons toute modification ici avec une nouvelle date et vous demanderons d'accepter les changements importants."]],
      ] },
  },

  cookies: {
    en: { title: "Cookie Policy", intro: "This policy explains the small pieces of information ClinicFlow saves in your browser. ClinicFlow does not use advertising, analytics or third-party tracking cookies.",
      sections: [
        ["1. What we use", ["Instead of traditional cookies, ClinicFlow uses your browser's local storage, a similar technology that keeps a few small values on your own device. They are never used to track you across websites or to build a profile."]],
        ["2. Strictly necessary (always on)", [
          "• cf_token – keeps you signed in on this device. Deleted when you sign out (sessions expire after 30 days).",
          "• cf_consent – remembers that you accepted the Terms and your cookie choices, so we don't ask every time. Kept 12 months or until the documents change.",
          "These are needed for the Service to work and for security, so they cannot be turned off."]],
        ["3. Preferences (optional – off unless you allow them)", [
          "• cf_lang – remembers English or French.",
          "• cf_a11y – remembers your accessibility settings (text size, contrast, spacing, motion).",
          "• cf_crowd_… – remembers that you already answered “How busy is it?” for a visit.",
          "If you do not allow preferences, the app still works; your choices just reset when you close the page."]],
        ["4. Third parties", ["No third-party content is loaded automatically: our fonts and icons are hosted on our own server. Google Maps opens only when you press “Directions”, in a new tab, under Google's own privacy policy. A clinic may choose to show a photo hosted on another website; that website may receive basic technical information (such as your IP address) when the image loads."]],
        ["5. Changing your choice", ["Use “Cookie settings” at the bottom of any page at any time. You can also clear this site's data in your browser settings; you will then be signed out and asked for your choices again."]],
      ] },
    fr: { title: "Politique relative aux témoins", intro: "La présente politique explique les petits renseignements que ClinicFlow enregistre dans votre navigateur. ClinicFlow n'utilise aucun témoin (cookie) de publicité, d'analyse ou de suivi par des tiers.",
      sections: [
        ["1. Ce que nous utilisons", ["Plutôt que des témoins traditionnels, ClinicFlow utilise le stockage local de votre navigateur, une technologie semblable qui conserve quelques petites valeurs sur votre propre appareil. Elles ne servent jamais à vous suivre d'un site à l'autre ni à créer un profil."]],
        ["2. Strictement nécessaires (toujours actifs)", [
          "• cf_token – vous garde connecté sur cet appareil. Supprimé à la déconnexion (les sessions expirent après 30 jours).",
          "• cf_consent – retient que vous avez accepté les conditions et vos choix relatifs aux témoins, pour ne pas vous les redemander chaque fois. Conservé 12 mois ou jusqu'à la modification des documents.",
          "Ils sont nécessaires au fonctionnement et à la sécurité du Service et ne peuvent donc pas être désactivés."]],
        ["3. Préférences (facultatives – désactivées sauf si vous les autorisez)", [
          "• cf_lang – retient le français ou l'anglais.",
          "• cf_a11y – retient vos réglages d'accessibilité (taille du texte, contraste, espacement, animations).",
          "• cf_crowd_… – retient que vous avez déjà répondu à « Est-ce achalandé? » pour une visite.",
          "Si vous n'autorisez pas les préférences, l'application fonctionne quand même; vos choix sont simplement réinitialisés lorsque vous fermez la page."]],
        ["4. Tiers", ["Aucun contenu de tiers n'est chargé automatiquement : nos polices et nos icônes sont hébergées sur notre propre serveur. Google Maps s'ouvre seulement lorsque vous appuyez sur « Itinéraire », dans un nouvel onglet, selon la politique de confidentialité de Google. Une clinique peut choisir d'afficher une photo hébergée sur un autre site Web; ce site peut recevoir des renseignements techniques de base (comme votre adresse IP) lorsque l'image se charge."]],
        ["5. Modifier votre choix", ["Utilisez « Paramètres des témoins » au bas de n'importe quelle page, en tout temps. Vous pouvez aussi effacer les données de ce site dans les paramètres de votre navigateur; vous serez alors déconnecté et vos choix vous seront redemandés."]],
      ] },
  },
  // =====================================================================================================
  accessibility: {
    en: { title: "Accessibility Statement", intro: "ClinicFlow is designed so that everyone can book and follow their care, whatever their abilities.",
      sections: [
        ["Our commitment", ["We aim to meet the Web Content Accessibility Guidelines (WCAG) 2.1, level AA, in line with Ontario's Accessibility for Ontarians with Disabilities Act (AODA). Every page is checked with automated accessibility testing and keyboard-only testing."]],
        ["Features", ["• Adjustable text size, high contrast, easier-reading spacing and reduced motion.", "• Voice control and read-aloud, for people who cannot easily type or read.", "• Works with screen readers (VoiceOver, TalkBack, NVDA, JAWS), switch access and the keyboard alone.", "• Full English and French.", "• Large touch targets and a layout that works on phones, tablets and computers."]],
        ["Other ways to book", ["You can always book, change or cancel by phone or in person with your clinic. Staff can book for you in ClinicFlow."]],
        ["Feedback and alternate formats", ["If something is hard to use, or you need these documents in another format (large print, plain text, read aloud), contact {email}. We will respond and work with you on a solution."]],
      ] },
    fr: { title: "Déclaration d'accessibilité", intro: "ClinicFlow est conçu pour que tout le monde puisse réserver et suivre ses soins, quelles que soient ses capacités.",
      sections: [
        ["Notre engagement", ["Nous visons à respecter les Règles pour l'accessibilité des contenus Web (WCAG) 2.1, niveau AA, conformément à la Loi de 2005 sur l'accessibilité pour les personnes handicapées de l'Ontario (LAPHO). Chaque page est vérifiée par des tests d'accessibilité automatisés et des tests au clavier seulement."]],
        ["Fonctions", ["• Taille du texte réglable, contraste élevé, espacement facilitant la lecture et réduction des animations.", "• Commande vocale et lecture à voix haute, pour les personnes qui ne peuvent pas facilement taper ou lire.", "• Compatible avec les lecteurs d'écran (VoiceOver, TalkBack, NVDA, JAWS), l'accès par contacteur et le clavier seul.", "• Entièrement en français et en anglais.", "• Grandes zones tactiles et mise en page adaptée aux téléphones, tablettes et ordinateurs."]],
        ["Autres façons de réserver", ["Vous pouvez toujours réserver, modifier ou annuler par téléphone ou en personne auprès de votre clinique. Le personnel peut réserver pour vous dans ClinicFlow."]],
        ["Commentaires et autres formats", ["Si quelque chose est difficile à utiliser, ou si vous avez besoin de ces documents dans un autre format (gros caractères, texte simple, lecture à voix haute), écrivez à {email}. Nous vous répondrons et chercherons une solution avec vous."]],
      ] },
  },
  // =====================================================================================================
  staff: {
    en: { title: "Staff Confidentiality & Acceptable Use Agreement", intro: "You are accessing personal and personal health information on behalf of your clinic. Please read and accept this agreement before continuing.",
      sections: [
        ["Your commitments", [
          "• I will access, use and share patient information only when I need it to do my job at this clinic (need-to-know). I will never look up my own record, or records of family, friends, colleagues or public figures, out of curiosity.",
          "• I will keep my password and verification codes private, never share my account, and sign out of shared computers.",
          "• I will not copy, photograph, print, download, email or otherwise remove patient information from ClinicFlow except as my clinic authorizes.",
          "• I will not enter clinical information (diagnoses, symptoms, treatments, test results) in ClinicFlow notes, forms or messages.",
          "• I will report any suspected privacy breach, lost device or misuse immediately to my clinic's privacy contact.",
          "• I will follow my clinic's privacy and security policies and applicable laws, including Ontario's PHIPA."]],
        ["I understand that", [
          "• I act as an agent of my clinic, which is the health information custodian.",
          "• Every time I open or change an appointment record, it is recorded in an access log that my clinic can review.",
          "• Breaking this agreement may lead to loss of access, discipline including dismissal, reports to my regulatory college, and fines or prosecution under privacy laws.",
          "• My confidentiality obligations continue after my access ends."]],
      ] },
    fr: { title: "Entente de confidentialité et d'utilisation acceptable du personnel", intro: "Vous accédez à des renseignements personnels et à des renseignements personnels sur la santé pour le compte de votre clinique. Veuillez lire et accepter la présente entente avant de continuer.",
      sections: [
        ["Mes engagements", [
          "• J'accéderai aux renseignements des patients, les utiliserai et les communiquerai seulement lorsque j'en ai besoin pour faire mon travail à cette clinique (principe du besoin de savoir). Je ne consulterai jamais, par curiosité, mon propre dossier ni ceux de membres de ma famille, d'amis, de collègues ou de personnalités publiques.",
